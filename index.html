<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scrooge Case — Luxury Mines</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            color: white;
            padding: 20px 16px 80px;
            min-height: 100vh;
            position: relative;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        /* Фон с золотой пыльцой и долларами */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.08"><text x="15" y="30" font-size="22" fill="%23ffd700">💰</text><text x="55" y="70" font-size="28" fill="%23ffcc00">💵</text><text x="100" y="45" font-size="18" fill="%23ffd700">💰</text><text x="140" y="90" font-size="24" fill="%23ffcc00">💵</text><text x="25" y="120" font-size="20" fill="%23ffd700">💰</text><text x="80" y="150" font-size="26" fill="%23ffcc00">💵</text><text x="130" y="170" font-size="18" fill="%23ffd700">💰</text><text x="165" y="130" font-size="22" fill="%23ffcc00">💵</text><text x="45" y="180" font-size="16" fill="%23ffd700">💰</text><text x="110" y="195" font-size="20" fill="%23ffcc00">💵</text></svg>');
            background-repeat: repeat;
            background-size: 100px 100px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 10%, rgba(26, 20, 10, 0.7), rgba(5, 3, 2, 0.95));
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Верхняя панель люкс */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 15, 8, 0.8));
            backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 8px 20px;
            margin-bottom: 28px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.1);
        }

        .balance {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .balance span {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .add-stars {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .add-stars:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }

        /* Навигация премиум */
        .game-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            padding: 8px;
            border-radius: 80px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .game-tab {
            flex: 1;
            text-align: center;
            padding: 14px 8px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .game-tab.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: scale(1.02);
        }

        /* Карточка роскошь */
        .game-card {
            background: linear-gradient(145deg, rgba(20, 18, 14, 0.75), rgba(10, 8, 6, 0.85));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 28px 24px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            margin-bottom: 24px;
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 1px;
        }

        /* Секции */
        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: rgba(255, 215, 0, 0.7);
            margin-bottom: 14px;
        }

        /* Кнопки ставок премиум */
        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .bet-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 170, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 16px;
            backdrop-filter: blur(4px);
            flex: 1 0 auto;
            text-align: center;
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
            transform: scale(1.02);
        }

        /* Карточки мин премиум */
        .mines-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
        }

        .mine-card {
            flex: 1;
            background: linear-gradient(145deg, rgba(255, 215, 0, 0.08), rgba(255, 170, 0, 0.03));
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 28px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }

        .mine-card.active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            transform: translateY(-3px);
        }

        .mine-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .mine-count {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .mine-max {
            font-size: 11px;
            opacity: 0.6;
            font-weight: 500;
        }

        /* Информационная панель */
        .info-panel {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            border-radius: 32px;
            padding: 20px;
            margin: 24px 0;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .multiplier-preview {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin: 16px 0;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .potential-win {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* Кнопки действия */
        .btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 800;
            color: #1a1a1a;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cash {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        /* Игровое поле премиум */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 28px 0;
            aspect-ratio: 1;
        }

        .mine-cell {
            background: linear-gradient(145deg, rgba(30, 28, 22, 0.9), rgba(20, 18, 14, 0.95));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .mine-cell.revealing {
            animation: popOpen 0.25s ease-out forwards;
        }

        @keyframes popOpen {
            0% { transform: scale(0.7); opacity: 0; }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }

        .mine-cell:active {
            transform: scale(0.92);
        }

        .mine-cell.safe {
            background: linear-gradient(145deg, rgba(46, 204, 113, 0.2), rgba(39, 174, 96, 0.15));
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }

        .mine-cell.mine-revealed {
            background: linear-gradient(145deg, #9b2c2c, #5a1010);
            animation: explode 0.4s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); background: #ff6600; }
            30% { transform: scale(1.25); background: #ff3300; }
            100% { transform: scale(1); background: #5a1010; }
        }

        .mine-cell .hint-number {
            position: absolute;
            bottom: 5px;
            right: 8px;
            font-size: 11px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 2px 7px;
            font-weight: 700;
        }

        /* Анимация взрыва */
        .explosion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 100, 0, 0.8), rgba(150, 0, 0, 0.9));
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: explosionFlash 0.6s ease-out forwards;
        }

        @keyframes explosionFlash {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            20% { opacity: 1; backdrop-filter: blur(10px); }
            100% { opacity: 0; backdrop-filter: blur(0px); }
        }

        .shake-field {
            animation: shakeField 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeField {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        /* Уведомления */
        .toast {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(30, 25, 15, 0.95));
            backdrop-filter: blur(20px);
            padding: 14px 28px;
            border-radius: 60px;
            z-index: 1000;
            transition: 0.25s;
            opacity: 0;
            pointer-events: none;
            font-weight: 600;
            border: 1px solid #ffd700;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
            font-size: 14px;
        }

        .multiplier-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            padding: 6px 16px;
            border-radius: 60px;
            font-weight: 800;
            display: inline-block;
        }

        /* Эффект свечения */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">💎 <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">💎 +500</button>
    </div>

    <div class="game-nav">
        <div class="game-tab active" data-game="mines">💎 MINES</div>
        <div class="game-tab" data-game="wheel">🎡 WHEEL</div>
        <div class="game-tab" data-game="rocket">🚀 ROCKET</div>
    </div>

    <div id="gameContainer"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== БАЛАНС ==========
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`✨ +${amount} Stars получено!`, false);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ Недостаточно средств! Пополните баланс.', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🏆 ПОБЕДА! +${amount} Stars!`, false);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.borderColor = isError ? '#e74c3c' : '#ffd700';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ========== ИГРА МИННОЕ ПОЛЕ ==========
    let minesGame = {
        active: false, board: [], revealed: [], minesCount: 3, bet: 50,
        multiplier: 1, safeLeft: 0, currentBet: 0, cellsRevealed: 0, maxMultiplier: 0
    };
    
    function getBaseMultiplier(minesCount) {
        return {3: 2.5, 5: 4.5, 7: 7.5}[minesCount] || 3.0;
    }
    
    function calculateMultiplier(minesCount, openedSafe, totalSafe) {
        const baseMax = getBaseMultiplier(minesCount);
        return 1 + (baseMax - 1) * (openedSafe / totalSafe);
    }
    
    function showExplosionEffect() {
        const overlay = document.createElement('div');
        overlay.className = 'explosion-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 600);
        const grid = document.querySelector('.mines-grid');
        if (grid) { grid.classList.add('shake-field'); setTimeout(() => grid.classList.remove('shake-field'), 500); }
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        }
    }
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        minesGame.cellsRevealed = 0;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) { newBoard[r][c] = -1; minesPlaced++; }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`🚀 Игра началась! Ставка ${minesGame.bet} Stars | x${minesGame.maxMultiplier} максимум`, false);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active || minesGame.revealed[row][col]) return;
        const cellDiv = document.querySelector(`.mine-cell[data-row='${row}'][data-col='${col}']`);
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            if (cellDiv) {
                cellDiv.classList.add('mine-revealed', 'revealing');
                setTimeout(() => { cellDiv.innerHTML = '💣'; cellDiv.classList.add('revealed'); }, 150);
            }
            showExplosionEffect();
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        if (cellDiv) {
            cellDiv.classList.add('revealing');
            setTimeout(() => {
                cellDiv.classList.add('safe', 'revealed');
                cellDiv.innerHTML = '💎';
                const val = minesGame.board[row][col];
                if (val > 0) {
                    const hintSpan = document.createElement('span');
                    hintSpan.className = 'hint-number';
                    hintSpan.textContent = val;
                    cellDiv.appendChild(hintSpan);
                }
            }, 100);
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        const totalSafe = 25 - minesGame.minesCount;
        minesGame.multiplier = parseFloat(calculateMultiplier(minesGame.minesCount, minesGame.cellsRevealed, totalSafe).toFixed(2));
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! ${win} Stars (x${minesGame.multiplier})!`, false);
            renderMinesGame();
            return;
        }
        renderMinesGameStats();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 ЗАБРАНО ${win} Stars!`, false);
        renderMinesGame();
    }
    
    function updatePreview() {
        const previewMult = getBaseMultiplier(minesGame.minesCount);
        const potential = Math.floor(minesGame.bet * previewMult);
        const multEl = document.getElementById('previewMultiplier');
        const potEl = document.getElementById('previewPotential');
        if (multEl) multEl.textContent = previewMult;
        if (potEl) potEl.textContent = potential.toLocaleString();
    }
    
    function renderMinesGameStats() {
        const statsDiv = document.getElementById('minesStats');
        if (!statsDiv) return;
        const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
        const totalSafe = 25 - minesGame.minesCount;
        const progress = Math.floor((minesGame.cellsRevealed / totalSafe) * 100);
        statsDiv.innerHTML = `
            <div class="info-panel">
                <div class="info-row"><span>🎯 ПРОГРЕСС</span><span>${progress}%</span></div>
                <div class="info-row"><span>💎 БЕЗОПАСНО</span><span>${minesGame.safeLeft} / ${totalSafe}</span></div>
                <div class="multiplier-preview">x${minesGame.multiplier}</div>
                <div class="potential-win">💎 ЗАБРАТЬ: ${potentialWin.toLocaleString()} STARS 💎</div>
            </div>
            <button class="btn btn-cash" onclick="cashoutMines()">💎 ЗАБРАТЬ ВЫИГРЫШ 💎</button>
        `;
    }
    
    function renderMinesGame() {
        const container = document.getElementById('gameContainer');
        if (!minesGame.active || !minesGame.board.length) {
            updatePreview();
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">💎 MINES 💎</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${minesGame.bet === 20 ? 'active' : ''}" data-bet="20">20 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="section-label">💣 КОЛИЧЕСТВО МИН</div>
                    <div class="mines-buttons">
                        <div class="mine-card ${minesGame.minesCount === 3 ? 'active' : ''}" data-mines="3">
                            <div class="mine-icon">💎💎💎</div>
                            <div class="mine-count">3 мины</div>
                            <div class="mine-max">Макс x2.5</div>
                        </div>
                        <div class="mine-card ${minesGame.minesCount === 5 ? 'active' : ''}" data-mines="5">
                            <div class="mine-icon">💎💎💎💎💎</div>
                            <div class="mine-count">5 мин</div>
                            <div class="mine-max">Макс x4.5</div>
                        </div>
                        <div class="mine-card ${minesGame.minesCount === 7 ? 'active' : ''}" data-mines="7">
                            <div class="mine-icon">💎💎💎💎💎💎💎</div>
                            <div class="mine-count">7 мин</div>
                            <div class="mine-max">Макс x7.5</div>
                        </div>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>⭐ ТЕКУЩАЯ СТАВКА</span><span>${minesGame.bet} STARS</span></div>
                        <div class="info-row"><span>🏆 МАКС. МНОЖИТЕЛЬ</span><span>x<span id="previewMultiplier">${getBaseMultiplier(minesGame.minesCount)}</span></span></div>
                        <div class="potential-win" style="margin-top: 16px;">🏆 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: <span id="previewPotential">${Math.floor(minesGame.bet * getBaseMultiplier(minesGame.minesCount)).toLocaleString()}</span> STARS 🏆</div>
                    </div>
                    <button class="btn" id="startGameBtn">💎 НАЧАТЬ ИГРУ 💎</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { minesGame.bet = parseInt(btn.dataset.bet); renderMinesGame(); };
            });
            document.querySelectorAll('.mine-card').forEach(card => {
                card.onclick = () => { minesGame.minesCount = parseInt(card.dataset.mines); renderMinesGame(); };
            });
            document.getElementById('startGameBtn').onclick = initMinesGame;
            return;
        }
        let gridHtml = '<div class="mines-grid">';
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const isRevealed = minesGame.revealed[i][j];
                let content = '💎', addClass = '';
                if (isRevealed) {
                    if (minesGame.board[i][j] === -1) { content = '💣'; addClass = 'mine-revealed revealed'; }
                    else { content = '💎'; addClass = 'safe revealed'; }
                }
                let hint = '';
                if (isRevealed && minesGame.board[i][j] > 0 && minesGame.board[i][j] !== -1) {
                    hint = `<span class="hint-number">${minesGame.board[i][j]}</span>`;
                }
                gridHtml += `<div class="mine-cell ${addClass}" data-row="${i}" data-col="${j}" onclick="revealMineCell(${i},${j})">${content}${hint}</div>`;
            }
        }
        gridHtml += '</div>';
        container.innerHTML = `<div class="game-card"><div class="game-title">💎 MINES | ${minesGame.minesCount} MINES 💎</div>${gridHtml}<div id="minesStats"></div></div>`;
        renderMinesGameStats();
    }
    
    function renderWheelGame() {
        document.getElementById('gameContainer').innerHTML = `<div class="game-card"><div class="game-title">🎡 FORTUNE WHEEL</div><div style="text-align:center; padding:60px 20px;"><div style="font-size: 64px; margin-bottom: 20px;">🚧</div><p style="opacity: 0.7;">Скоро будет доступно...</p><p style="margin-top: 16px; font-size: 14px; opacity: 0.5;">Следите за обновлениями</p></div></div>`;
    }
    
    function renderRocketGame() {
        document.getElementById('gameContainer').innerHTML = `<div class="game-card"><div class="game-title">🚀 ROCKET</div><div style="text-align:center; padding:60px 20px;"><div style="font-size: 64px; margin-bottom: 20px;">🚀</div><p style="opacity: 0.7;">Скоро будет доступно...</p><p style="margin-top: 16px; font-size: 14px; opacity: 0.5;">Следите за обновлениями</p></div></div>`;
    }
    
    let currentGame = 'mines';
    function switchGame(game) {
        currentGame = game;
        document.querySelectorAll('.game-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.game === game);
        });
        if (game === 'mines') renderMinesGame();
        else if (game === 'wheel') renderWheelGame();
        else renderRocketGame();
    }
    
    document.querySelectorAll('.game-tab').forEach(tab => {
        tab.onclick = () => switchGame(tab.dataset.game);
    });
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMinesGame();
</script>
</body>
</html>
