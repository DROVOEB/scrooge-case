<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Scrooge Case — Luxury Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --gold: #ffd700;
            --gold-dark: #ccaa00;
            --gold-light: #ffe066;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --dark-bg: #0a0a0a;
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            color: white;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.06"><text x="15" y="30" font-size="24" fill="%23ffd700">💎</text><text x="55" y="70" font-size="30" fill="%23ffcc00">🏆</text><text x="100" y="45" font-size="20" fill="%23ffd700">✨</text><text x="140" y="90" font-size="26" fill="%23ffcc00">💎</text><text x="25" y="120" font-size="22" fill="%23ffd700">🏆</text><text x="80" y="150" font-size="28" fill="%23ffcc00">✨</text><text x="130" y="170" font-size="20" fill="%23ffd700">💎</text><text x="165" y="130" font-size="24" fill="%23ffcc00">🏆</text><text x="45" y="180" font-size="18" fill="%23ffd700">✨</text><text x="110" y="195" font-size="22" fill="%23ffcc00">💎</text></svg>');
            background-repeat: repeat;
            background-size: 120px 120px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 10%, rgba(20, 15, 8, 0.6), rgba(5, 3, 2, 0.95));
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 15, 8, 0.8));
            backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 8px 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .balance {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance span {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .add-stars {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .add-stars:active {
            transform: scale(0.95);
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 600;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 16px;
        }

        .game-menu-card {
            position: relative;
            background: linear-gradient(145deg, rgba(25, 22, 18, 0.9), rgba(15, 12, 8, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .game-menu-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 48px;
            padding: 2px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-menu-card:hover::before {
            opacity: 1;
        }

        .game-menu-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .game-menu-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .game-menu-card:nth-child(1) .game-menu-icon { animation-delay: 0s; }
        .game-menu-card:nth-child(2) .game-menu-icon { animation-delay: 0.5s; }
        .game-menu-card:nth-child(3) .game-menu-icon { animation-delay: 1s; }

        .game-menu-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .game-menu-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .game-menu-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            border-radius: 60px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }

        .game-menu-card[data-game="mines"] .game-menu-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .game-card {
            background: linear-gradient(145deg, rgba(20, 18, 14, 0.75), rgba(10, 8, 6, 0.85));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        @media (min-width: 768px) {
            .game-card {
                padding: 32px 28px;
            }
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: rgba(255, 215, 0, 0.7);
            margin-bottom: 14px;
        }

        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .bet-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 170, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 16px;
            flex: 1 0 auto;
            text-align: center;
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .mines-buttons {
            display: flex;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .mine-card {
            flex: 1;
            background: linear-gradient(145deg, rgba(255, 215, 0, 0.08), rgba(255, 170, 0, 0.03));
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 28px;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mine-card.active {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            border-color: #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
            transform: translateY(-3px);
        }

        .mine-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .mine-count {
            font-size: 14px;
            font-weight: 700;
        }

        .mine-max {
            font-size: 10px;
            opacity: 0.6;
        }

        .info-panel {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            border-radius: 32px;
            padding: 20px;
            margin: 24px 0;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .multiplier-preview {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin: 16px 0;
        }

        .potential-win {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 28px 0;
            aspect-ratio: 1;
        }

        .mine-cell {
            background: linear-gradient(145deg, rgba(30, 28, 22, 0.9), rgba(20, 18, 14, 0.95));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .mine-cell.revealing {
            animation: popOpen 0.25s ease-out forwards;
        }

        @keyframes popOpen {
            0% { transform: scale(0.7); opacity: 0; }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); opacity: 1; }
        }

        .mine-cell:active {
            transform: scale(0.92);
        }

        .mine-cell.safe {
            background: linear-gradient(145deg, rgba(46, 204, 113, 0.2), rgba(39, 174, 96, 0.15));
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }

        .mine-cell.mine-revealed {
            background: linear-gradient(145deg, #9b2c2c, #5a1010);
            animation: explode 0.4s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); background: #ff6600; }
            30% { transform: scale(1.2); background: #ff3300; }
            100% { transform: scale(1); background: #5a1010; }
        }

        .mine-cell .hint-number {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 10px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 2px 5px;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 800;
            color: #1a1a1a;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cash {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .explosion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 100, 0, 0.8), rgba(150, 0, 0, 0.9));
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: explosionFlash 0.6s ease-out forwards;
        }

        @keyframes explosionFlash {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            20% { opacity: 1; backdrop-filter: blur(10px); }
            100% { opacity: 0; backdrop-filter: blur(0px); }
        }

        .shake-field {
            animation: shakeField 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeField {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(30, 25, 15, 0.95));
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 1000;
            transition: 0.25s;
            opacity: 0;
            pointer-events: none;
            font-weight: 600;
            border: 1px solid #ffd700;
            white-space: nowrap;
            font-size: 14px;
        }

        @media (min-width: 768px) {
            .mine-cell {
                font-size: 40px;
            }
        }

        @media (max-width: 480px) {
            .mine-cell {
                font-size: 24px;
            }
            .bet-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
            .game-menu-icon {
                font-size: 56px;
            }
            .game-menu-title {
                font-size: 24px;
            }
            .games-grid {
                gap: 16px;
            }
            .game-menu-card {
                padding: 24px 16px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">💎 <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">💎 +500</button>
    </div>

    <div id="mainContent"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== БАЛАНС ==========
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`✨ +${amount} Stars получено!`, false);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ Недостаточно средств! Пополните баланс.', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🏆 ПОБЕДА! +${amount} Stars!`, false);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.borderColor = isError ? '#e74c3c' : '#ffd700';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ========== СОСТОЯНИЕ ==========
    let currentScreen = 'menu';
    let currentGameId = null;
    
    // ========== ИГРА: МИННОЕ ПОЛЕ ==========
    let minesGame = {
        active: false, board: [], revealed: [], minesCount: 3, bet: 50,
        multiplier: 1, safeLeft: 0, currentBet: 0, cellsRevealed: 0, maxMultiplier: 0
    };
    
    // ПОВЫШЕННЫЕ КОЭФФИЦИЕНТЫ
    function getBaseMultiplier(minesCount) {
        const multipliers = {
            3: 3.5,   // было 2.5
            5: 6.5,   // было 4.5
            7: 11.0   // было 7.5
        };
        return multipliers[minesCount] || 3.5;
    }
    
    function calculateMultiplier(minesCount, openedSafe, totalSafe) {
        const baseMax = getBaseMultiplier(minesCount);
        // Плавный рост множителя с каждым открытым квадратом
        const progress = openedSafe / totalSafe;
        // Используем квадратичную функцию для более быстрого роста в конце
        const accelerated = Math.pow(progress, 1.2);
        return 1 + (baseMax - 1) * accelerated;
    }
    
    function showExplosionEffect() {
        const overlay = document.createElement('div');
        overlay.className = 'explosion-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 600);
        const grid = document.querySelector('.mines-grid');
        if (grid) { grid.classList.add('shake-field'); setTimeout(() => grid.classList.remove('shake-field'), 500); }
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        }
    }
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        minesGame.cellsRevealed = 0;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) { newBoard[r][c] = -1; minesPlaced++; }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`🚀 Игра началась! Ставка ${minesGame.bet} Stars | Макс x${minesGame.maxMultiplier}`, false);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active || minesGame.revealed[row][col]) return;
        const cellDiv = document.querySelector(`.mine-cell[data-row='${row}'][data-col='${col}']`);
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            if (cellDiv) {
                cellDiv.classList.add('mine-revealed', 'revealing');
                setTimeout(() => { cellDiv.innerHTML = '💣'; cellDiv.classList.add('revealed'); }, 150);
            }
            showExplosionEffect();
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        if (cellDiv) {
            cellDiv.classList.add('revealing');
            setTimeout(() => {
                cellDiv.classList.add('safe', 'revealed');
                cellDiv.innerHTML = '💎';
                const val = minesGame.board[row][col];
                if (val > 0) {
                    const hintSpan = document.createElement('span');
                    hintSpan.className = 'hint-number';
                    hintSpan.textContent = val;
                    cellDiv.appendChild(hintSpan);
                }
            }, 100);
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        const totalSafe = 25 - minesGame.minesCount;
        minesGame.multiplier = parseFloat(calculateMultiplier(minesGame.minesCount, minesGame.cellsRevealed, totalSafe).toFixed(2));
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! ${win} Stars (x${minesGame.multiplier})!`, false);
            renderMinesGame();
            return;
        }
        renderMinesGameStats();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 ЗАБРАНО ${win} Stars!`, false);
        renderMinesGame();
    }
    
    function renderMinesGameStats() {
        const statsDiv = document.getElementById('minesStats');
        if (!statsDiv) return;
        const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
        const totalSafe = 25 - minesGame.minesCount;
        const progress = Math.floor((minesGame.cellsRevealed / totalSafe) * 100);
        statsDiv.innerHTML = `
            <div class="info-panel">
                <div class="info-row"><span>🎯 ПРОГРЕСС</span><span>${progress}%</span></div>
                <div class="info-row"><span>💎 БЕЗОПАСНО</span><span>${minesGame.safeLeft} / ${totalSafe}</span></div>
                <div class="multiplier-preview">x${minesGame.multiplier}</div>
                <div class="potential-win">💰 ЗАБРАТЬ: ${potentialWin.toLocaleString()} STARS 💰</div>
            </div>
            <button class="btn btn-cash" onclick="window.cashoutMines()">💰 ЗАБРАТЬ ВЫИГРЫШ 💰</button>
        `;
    }
    
    function renderMinesGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        if (!minesGame.active || !minesGame.board.length) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">💎 MINES 💎</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${minesGame.bet === 20 ? 'active' : ''}" data-bet="20">20 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="section-label">💣 КОЛИЧЕСТВО МИН</div>
                    <div class="mines-buttons">
                        <div class="mine-card ${minesGame.minesCount === 3 ? 'active' : ''}" data-mines="3">
                            <div class="mine-icon">💎💎💎</div>
                            <div class="mine-count">3 мины</div>
                            <div class="mine-max">Макс x3.5</div>
                        </div>
                        <div class="mine-card ${minesGame.minesCount === 5 ? 'active' : ''}" data-mines="5">
                            <div class="mine-icon">💎💎💎💎💎</div>
                            <div class="mine-count">5 мин</div>
                            <div class="mine-max">Макс x6.5</div>
                        </div>
                        <div class="mine-card ${minesGame.minesCount === 7 ? 'active' : ''}" data-mines="7">
                            <div class="mine-icon">💎💎💎💎💎💎💎</div>
                            <div class="mine-count">7 мин</div>
                            <div class="mine-max">Макс x11.0</div>
                        </div>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>⭐ ТЕКУЩАЯ СТАВКА</span><span>${minesGame.bet} STARS</span></div>
                        <div class="info-row"><span>🏆 МАКС. МНОЖИТЕЛЬ</span><span>x${getBaseMultiplier(minesGame.minesCount)}</span></div>
                        <div class="potential-win">🏆 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: ${Math.floor(minesGame.bet * getBaseMultiplier(minesGame.minesCount)).toLocaleString()} STARS 🏆</div>
                    </div>
                    <button class="btn" id="startGameBtn">💎 НАЧАТЬ ИГРУ 💎</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { minesGame.bet = parseInt(btn.dataset.bet); renderMinesGame(); };
            });
            document.querySelectorAll('.mine-card').forEach(card => {
                card.onclick = () => { minesGame.minesCount = parseInt(card.dataset.mines); renderMinesGame(); };
            });
            const startBtn = document.getElementById('startGameBtn');
            if (startBtn) startBtn.onclick = initMinesGame;
            return;
        }
        
        let gridHtml = '<div class="mines-grid">';
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const isRevealed = minesGame.revealed[i][j];
                let content = '💎', addClass = '';
                if (isRevealed) {
                    if (minesGame.board[i][j] === -1) { content = '💣'; addClass = 'mine-revealed revealed'; }
                    else { content = '💎'; addClass = 'safe revealed'; }
                }
                let hint = '';
                if (isRevealed && minesGame.board[i][j] > 0 && minesGame.board[i][j] !== -1) {
                    hint = `<span class="hint-number">${minesGame.board[i][j]}</span>`;
                }
                gridHtml += `<div class="mine-cell ${addClass}" data-row="${i}" data-col="${j}" onclick="window.revealMineCell(${i},${j})">${content}${hint}</div>`;
            }
        }
        gridHtml += '</div>';
        container.innerHTML = `<div class="game-card"><div class="game-title">💎 MINES | ${minesGame.minesCount} MINES 💎</div>${gridHtml}<div id="minesStats"></div></div>`;
        renderMinesGameStats();
    }
    
    function renderWheelGame() {
        const container = document.getElementById('gameContent');
        if (container) {
            container.innerHTML = `<div class="game-card"><div class="game-title">🎡 FORTUNE WHEEL</div><div style="text-align:center; padding:60px 20px;"><div style="font-size: 64px; margin-bottom: 20px;">🎡</div><p style="opacity: 0.7;">Скоро будет доступно...</p><p style="margin-top: 16px; font-size: 13px; opacity: 0.5;">Следите за обновлениями</p></div></div>`;
        }
    }
    
    function renderRocketGame() {
        const container = document.getElementById('gameContent');
        if (container) {
            container.innerHTML = `<div class="game-card"><div class="game-title">🚀 ROCKET</div><div style="text-align:center; padding:60px 20px;"><div style="font-size: 64px; margin-bottom: 20px;">🚀</div><p style="opacity: 0.7;">Скоро будет доступно...</p><p style="margin-top: 16px; font-size: 13px; opacity: 0.5;">Следите за обновлениями</p></div></div>`;
        }
    }
    
    function renderMainMenu() {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <div class="games-grid">
                <div class="game-menu-card" data-game="mines">
                    <div class="game-menu-icon">💎</div>
                    <div class="game-menu-title">MINES</div>
                    <div class="game-menu-desc">Классическое минное поле. Открывай кристаллы, избегай мин и увеличивай множитель до x11!</div>
                    <div class="game-menu-badge">🔥 ПОПУЛЯРНОЕ</div>
                </div>
                <div class="game-menu-card" data-game="wheel">
                    <div class="game-menu-icon">🎡</div>
                    <div class="game-menu-title">FORTUNE WHEEL</div>
                    <div class="game-menu-desc">Колесо фортуны. Сделай ставку и крути колесо удачи! Победитель забирает всё.</div>
                    <div class="game-menu-badge">⚡ СКОРО</div>
                </div>
                <div class="game-menu-card" data-game="rocket">
                    <div class="game-menu-icon">🚀</div>
                    <div class="game-menu-title">ROCKET</div>
                    <div class="game-menu-desc">Ракетка. Лети выше и забирай выигрыш до того, как ракета взорвется!</div>
                    <div class="game-menu-badge">⚡ СКОРО</div>
                </div>
            </div>
        `;
        
        document.querySelectorAll('.game-menu-card').forEach(card => {
            card.onclick = () => {
                const gameId = card.dataset.game;
                openGame(gameId);
            };
        });
    }
    
    function openGame(gameId) {
        currentScreen = 'game';
        currentGameId = gameId;
        
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <button class="back-btn" id="backToMenuBtn">← ВЕРНУТЬСЯ В МЕНЮ</button>
            <div id="gameContent"></div>
        `;
        
        document.getElementById('backToMenuBtn').onclick = () => {
            currentScreen = 'menu';
            renderMainMenu();
        };
        
        if (gameId === 'mines') {
            minesGame.active = false;
            minesGame.board = [];
            renderMinesGame();
        } else if (gameId === 'wheel') {
            renderWheelGame();
        } else if (gameId === 'rocket') {
            renderRocketGame();
        }
    }
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMainMenu();
</script>
</body>
</html>
