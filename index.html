<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Scrooge Case — Luxury Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --gold: #ffd700;
            --gold-dark: #ccaa00;
            --gold-light: #ffe066;
            --gold-glow: rgba(255, 215, 0, 0.4);
        }

        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            color: white;
            padding: 20px;
            min-height: 100vh;
            position: relative;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.06"><text x="15" y="30" font-size="24" fill="%23ffd700">💎</text><text x="55" y="70" font-size="30" fill="%23ffcc00">🏆</text><text x="100" y="45" font-size="20" fill="%23ffd700">✨</text><text x="140" y="90" font-size="26" fill="%23ffcc00">💎</text><text x="25" y="120" font-size="22" fill="%23ffd700">🏆</text><text x="80" y="150" font-size="28" fill="%23ffcc00">✨</text><text x="130" y="170" font-size="20" fill="%23ffd700">💎</text><text x="165" y="130" font-size="24" fill="%23ffcc00">🏆</text><text x="45" y="180" font-size="18" fill="%23ffd700">✨</text><text x="110" y="195" font-size="22" fill="%23ffcc00">💎</text></svg>');
            background-repeat: repeat;
            background-size: 120px 120px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 10%, rgba(20, 15, 8, 0.6), rgba(5, 3, 2, 0.95));
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 15, 8, 0.8));
            backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 8px 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .balance {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance span {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .add-stars {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .add-stars:active {
            transform: scale(0.95);
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 600;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            margin-top: 16px;
        }

        .game-menu-card {
            position: relative;
            background: linear-gradient(145deg, rgba(25, 22, 18, 0.9), rgba(15, 12, 8, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .game-menu-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 48px;
            padding: 2px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-menu-card:hover::before {
            opacity: 1;
        }

        .game-menu-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .game-menu-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .game-menu-card:nth-child(1) .game-menu-icon { animation-delay: 0s; }
        .game-menu-card:nth-child(2) .game-menu-icon { animation-delay: 0.5s; }
        .game-menu-card:nth-child(3) .game-menu-icon { animation-delay: 1s; }

        .game-menu-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .game-menu-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .game-menu-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            border-radius: 60px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }

        .game-menu-card[data-game="mines"] .game-menu-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .game-card {
            background: linear-gradient(145deg, rgba(20, 18, 14, 0.75), rgba(10, 8, 6, 0.85));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        @media (min-width: 768px) {
            .game-card {
                padding: 32px 28px;
            }
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: rgba(255, 215, 0, 0.7);
            margin-bottom: 14px;
        }

        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .bet-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 170, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 16px;
            flex: 1 0 auto;
            text-align: center;
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .info-panel {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            border-radius: 32px;
            padding: 20px;
            margin: 24px 0;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .multiplier-preview {
            font-size: 42px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin: 16px 0;
        }

        .potential-win {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* Rocket Game Styles */
        .rocket-animation {
            text-align: center;
            margin: 30px 0;
            position: relative;
            min-height: 200px;
        }

        .rocket-ship {
            font-size: 80px;
            display: inline-block;
            transition: transform 0.05s linear;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }

        .rocket-ship.flying {
            animation: rocketFly 2s ease-out infinite;
        }

        @keyframes rocketFly {
            0% { transform: translateY(0) rotate(0deg); }
            30% { transform: translateY(-60px) rotate(-5deg); }
            70% { transform: translateY(-120px) rotate(5deg); }
            100% { transform: translateY(-200px) rotate(0deg); opacity: 0.5; }
        }

        .rocket-ship.exploding {
            animation: rocketExplode 0.5s ease-out forwards;
        }

        @keyframes rocketExplode {
            0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px #ff6600); }
            50% { transform: scale(1.5); opacity: 1; filter: drop-shadow(0 0 20px #ff3300); }
            100% { transform: scale(0.5); opacity: 0; filter: drop-shadow(0 0 0 #ff0000); }
        }

        .rocket-trail {
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 40px;
            background: linear-gradient(to top, #ff6600, #ffaa00);
            border-radius: 2px;
            animation: trailFlicker 0.1s infinite;
        }

        @keyframes trailFlicker {
            0%, 100% { opacity: 0.8; height: 40px; }
            50% { opacity: 1; height: 50px; }
        }

        .coefficient-display {
            font-size: 64px;
            font-weight: 800;
            text-align: center;
            margin: 20px 0;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 800;
            color: #1a1a1a;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cash {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .explosion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 100, 0, 0.8), rgba(150, 0, 0, 0.9));
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: explosionFlash 0.6s ease-out forwards;
        }

        @keyframes explosionFlash {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            20% { opacity: 1; backdrop-filter: blur(10px); }
            100% { opacity: 0; backdrop-filter: blur(0px); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(30, 25, 15, 0.95));
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 1000;
            transition: 0.25s;
            opacity: 0;
            pointer-events: none;
            font-weight: 600;
            border: 1px solid #ffd700;
            white-space: nowrap;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .bet-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
            .game-menu-icon {
                font-size: 56px;
            }
            .game-menu-title {
                font-size: 24px;
            }
            .games-grid {
                gap: 16px;
            }
            .game-menu-card {
                padding: 24px 16px;
            }
            .coefficient-display {
                font-size: 48px;
            }
            .rocket-ship {
                font-size: 60px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">💎 <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">💎 +500</button>
    </div>

    <div id="mainContent"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== БАЛАНС ==========
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`✨ +${amount} Stars получено!`, false);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ Недостаточно средств! Пополните баланс.', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🏆 ПОБЕДА! +${amount} Stars!`, false);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.borderColor = isError ? '#e74c3c' : '#ffd700';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ========== СОСТОЯНИЕ ==========
    let currentScreen = 'menu';
    let currentGameId = null;
    
    // ========== ИГРА: МИННОЕ ПОЛЕ ==========
    let minesGame = {
        active: false, board: [], revealed: [], minesCount: 3, bet: 50,
        multiplier: 1, safeLeft: 0, currentBet: 0, cellsRevealed: 0, maxMultiplier: 0
    };
    
    function getBaseMultiplier(minesCount) {
        const multipliers = { 3: 3.5, 5: 6.5, 7: 11.0 };
        return multipliers[minesCount] || 3.5;
    }
    
    function calculateMultiplier(minesCount, openedSafe, totalSafe) {
        const baseMax = getBaseMultiplier(minesCount);
        const progress = openedSafe / totalSafe;
        const accelerated = Math.pow(progress, 1.2);
        return 1 + (baseMax - 1) * accelerated;
    }
    
    function showExplosionEffect() {
        const overlay = document.createElement('div');
        overlay.className = 'explosion-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 600);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        }
    }
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        minesGame.cellsRevealed = 0;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) { newBoard[r][c] = -1; minesPlaced++; }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`🚀 Игра началась! Ставка ${minesGame.bet} Stars | Макс x${minesGame.maxMultiplier}`, false);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active || minesGame.revealed[row][col]) return;
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            showExplosionEffect();
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        const totalSafe = 25 - minesGame.minesCount;
        minesGame.multiplier = parseFloat(calculateMultiplier(minesGame.minesCount, minesGame.cellsRevealed, totalSafe).toFixed(2));
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! ${win} Stars (x${minesGame.multiplier})!`, false);
            renderMinesGame();
            return;
        }
        renderMinesGame();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 ЗАБРАНО ${win} Stars!`, false);
        renderMinesGame();
    }
    
    function renderMinesGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        if (!minesGame.active || !minesGame.board.length) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">💎 MINES 💎</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${minesGame.bet === 20 ? 'active' : ''}" data-bet="20">20 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="section-label">💣 КОЛИЧЕСТВО МИН</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${minesGame.minesCount === 3 ? 'active' : ''}" data-mines="3">3 мины (x3.5)</button>
                        <button class="bet-btn ${minesGame.minesCount === 5 ? 'active' : ''}" data-mines="5">5 мин (x6.5)</button>
                        <button class="bet-btn ${minesGame.minesCount === 7 ? 'active' : ''}" data-mines="7">7 мин (x11.0)</button>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>⭐ СТАВКА</span><span>${minesGame.bet} STARS</span></div>
                        <div class="info-row"><span>🏆 МАКС. МНОЖИТЕЛЬ</span><span>x${getBaseMultiplier(minesGame.minesCount)}</span></div>
                        <div class="potential-win">🏆 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: ${Math.floor(minesGame.bet * getBaseMultiplier(minesGame.minesCount)).toLocaleString()} STARS 🏆</div>
                    </div>
                    <button class="btn" id="startGameBtn">💎 НАЧАТЬ ИГРУ 💎</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn[data-bet]').forEach(btn => {
                btn.onclick = () => { minesGame.bet = parseInt(btn.dataset.bet); renderMinesGame(); };
            });
            document.querySelectorAll('.bet-btn[data-mines]').forEach(btn => {
                btn.onclick = () => { minesGame.minesCount = parseInt(btn.dataset.mines); renderMinesGame(); };
            });
            document.getElementById('startGameBtn').onclick = initMinesGame;
            return;
        }
        
        const totalSafe = 25 - minesGame.minesCount;
        const progress = Math.floor((minesGame.cellsRevealed / totalSafe) * 100);
        const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
        
        let gridHtml = '<div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0;">';
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const isRevealed = minesGame.revealed[i][j];
                let content = '💎', style = '';
                if (isRevealed) {
                    if (minesGame.board[i][j] === -1) { content = '💣'; style = 'background: linear-gradient(145deg, #9b2c2c, #5a1010);'; }
                    else { content = '💎'; style = 'background: linear-gradient(145deg, #2a7a4a, #1a5a3a);'; }
                }
                gridHtml += `<div style="background: linear-gradient(145deg, rgba(30,28,22,0.9), rgba(20,18,14,0.95)); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; aspect-ratio: 1; cursor: pointer; border: 1px solid rgba(255,215,0,0.2); ${style}" onclick="window.revealMineCell(${i},${j})">${content}</div>`;
            }
        }
        gridHtml += '</div>';
        
        container.innerHTML = `
            <div class="game-card">
                <div class="game-title">💎 MINES | ${minesGame.minesCount} MINES 💎</div>
                ${gridHtml}
                <div class="info-panel">
                    <div class="info-row"><span>🎯 ПРОГРЕСС</span><span>${progress}%</span></div>
                    <div class="info-row"><span>💎 БЕЗОПАСНО</span><span>${minesGame.safeLeft} / ${totalSafe}</span></div>
                    <div class="multiplier-preview">x${minesGame.multiplier}</div>
                    <div class="potential-win">💰 ЗАБРАТЬ: ${potentialWin.toLocaleString()} STARS 💰</div>
                </div>
                <button class="btn btn-cash" onclick="window.cashoutMines()">💰 ЗАБРАТЬ ВЫИГРЫШ 💰</button>
            </div>
        `;
    }
    
    // ========== ИГРА: РАКЕТКА ==========
    let rocketGame = {
        active: false,
        bet: 50,
        currentBet: 0,
        multiplier: 1.00,
        targetMultiplier: 1.00,
        interval: null,
        cashedOut: false
    };
    
    function startRocketGame() {
        if (rocketGame.active) return;
        if (rocketGame.bet < 50) {
            showToast('Минимальная ставка 50 Stars', true);
            return;
        }
        if (!deductStars(rocketGame.bet)) return;
        
        rocketGame.active = true;
        rocketGame.currentBet = rocketGame.bet;
        rocketGame.multiplier = 1.00;
        rocketGame.cashedOut = false;
        
        // Случайный коэффициент от 1.5 до 25
        rocketGame.targetMultiplier = +(Math.random() * (25 - 1.5) + 1.5).toFixed(2);
        
        if (rocketGame.interval) clearInterval(rocketGame.interval);
        rocketGame.interval = setInterval(() => {
            if (!rocketGame.active) return;
            // Увеличиваем множитель с ускорением
            const increment = 0.02 + (rocketGame.multiplier / 200);
            rocketGame.multiplier = +(rocketGame.multiplier + increment).toFixed(2);
            
            if (rocketGame.multiplier >= rocketGame.targetMultiplier) {
                clearInterval(rocketGame.interval);
                rocketGame.active = false;
                showExplosionEffect();
                showToast(`💥 РАКЕТА ВЗОРВАЛАСЬ! Проиграно ${rocketGame.currentBet} Stars`, true);
                renderRocketGame();
            } else {
                renderRocketGame();
            }
        }, 80);
        
        renderRocketGame();
        showToast(`🚀 Ракета взлетает! Цель ~x${rocketGame.targetMultiplier}`, false);
    }
    
    function cashoutRocket() {
        if (!rocketGame.active || rocketGame.cashedOut) return;
        clearInterval(rocketGame.interval);
        const win = Math.floor(rocketGame.currentBet * rocketGame.multiplier);
        addWin(win);
        rocketGame.active = false;
        rocketGame.cashedOut = true;
        showToast(`💰 ВЫ ЗАБРАЛИ ${win} Stars (x${rocketGame.multiplier})!`, false);
        renderRocketGame();
    }
    
    function renderRocketGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        if (!rocketGame.active) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">🚀 ROCKET 🚀</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${rocketGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>🚀 МАКС. ВЫИГРЫШ</span><span>до x25</span></div>
                        <div class="info-row"><span>💎 СТАВКА</span><span>${rocketGame.bet} STARS</span></div>
                        <div class="potential-win">🏆 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: до ${(rocketGame.bet * 25).toLocaleString()} STARS 🏆</div>
                    </div>
                    <button class="btn" id="startRocketBtn">🚀 ЗАПУСТИТЬ РАКЕТУ 🚀</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { rocketGame.bet = parseInt(btn.dataset.bet); renderRocketGame(); };
            });
            document.getElementById('startRocketBtn').onclick = startRocketGame;
            return;
        }
        
        const potentialWin = Math.floor(rocketGame.currentBet * rocketGame.multiplier);
        const progress = Math.min(100, Math.floor((rocketGame.multiplier / rocketGame.targetMultiplier) * 100));
        
        container.innerHTML = `
            <div class="game-card">
                <div class="game-title">🚀 ROCKET IN FLIGHT 🚀</div>
                <div class="rocket-animation">
                    <div class="rocket-ship flying">🚀</div>
                    <div class="rocket-trail"></div>
                </div>
                <div class="coefficient-display">x${rocketGame.multiplier}</div>
                <div class="info-panel">
                    <div class="info-row"><span>🎯 ПРОГРЕСС ДО ЦЕЛИ</span><span>${progress}%</span></div>
                    <div class="info-row"><span>💎 СТАВКА</span><span>${rocketGame.currentBet} STARS</span></div>
                    <div class="info-row"><span>🏆 ТЕКУЩИЙ МНОЖИТЕЛЬ</span><span>x${rocketGame.multiplier}</span></div>
                    <div class="potential-win">💰 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: ${potentialWin.toLocaleString()} STARS 💰</div>
                </div>
                <button class="btn btn-cash" id="cashoutRocketBtn">🚀 ЗАБРАТЬ ВЫИГРЫШ 🚀</button>
            </div>
        `;
        document.getElementById('cashoutRocketBtn').onclick = cashoutRocket;
    }
    
    // ========== ДРУГИЕ ИГРЫ ==========
    function renderWheelGame() {
        const container = document.getElementById('gameContent');
        if (container) {
            container.innerHTML = `<div class="game-card"><div class="game-title">🎡 FORTUNE WHEEL</div><div style="text-align:center; padding:60px 20px;"><div style="font-size: 64px; margin-bottom: 20px;">🎡</div><p style="opacity: 0.7;">Скоро будет доступно...</p><p style="margin-top: 16px; font-size: 13px; opacity: 0.5;">Следите за обновлениями</p></div></div>`;
        }
    }
    
    // ========== ГЛАВНОЕ МЕНЮ ==========
    function renderMainMenu() {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <div class="games-grid">
                <div class="game-menu-card" data-game="mines">
                    <div class="game-menu-icon">💎</div>
                    <div class="game-menu-title">MINES</div>
                    <div class="game-menu-desc">Классическое минное поле. Открывай кристаллы, избегай мин и увеличивай множитель до x11!</div>
                    <div class="game-menu-badge">🔥 ПОПУЛЯРНОЕ</div>
                </div>
                <div class="game-menu-card" data-game="wheel">
                    <div class="game-menu-icon">🎡</div>
                    <div class="game-menu-title">FORTUNE WHEEL</div>
                    <div class="game-menu-desc">Колесо фортуны. Сделай ставку и крути колесо удачи! Победитель забирает всё.</div>
                    <div class="game-menu-badge">⚡ СКОРО</div>
                </div>
                <div class="game-menu-card" data-game="rocket">
                    <div class="game-menu-icon">🚀</div>
                    <div class="game-menu-title">ROCKET</div>
                    <div class="game-menu-desc">Ракетка. Лети выше, лови момент и забирай выигрыш до x25 до взрыва!</div>
                    <div class="game-menu-badge">🚀 АКТИВНА</div>
                </div>
            </div>
        `;
        
        document.querySelectorAll('.game-menu-card').forEach(card => {
            card.onclick = () => {
                const gameId = card.dataset.game;
                openGame(gameId);
            };
        });
    }
    
    function openGame(gameId) {
        currentScreen = 'game';
        currentGameId = gameId;
        
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <button class="back-btn" id="backToMenuBtn">← ВЕРНУТЬСЯ В МЕНЮ</button>
            <div id="gameContent"></div>
        `;
        
        document.getElementById('backToMenuBtn').onclick = () => {
            if (rocketGame.interval) clearInterval(rocketGame.interval);
            rocketGame.active = false;
            currentScreen = 'menu';
            renderMainMenu();
        };
        
        if (gameId === 'mines') {
            minesGame.active = false;
            minesGame.board = [];
            renderMinesGame();
        } else if (gameId === 'wheel') {
            renderWheelGame();
        } else if (gameId === 'rocket') {
            rocketGame.active = false;
            if (rocketGame.interval) clearInterval(rocketGame.interval);
            renderRocketGame();
        }
    }
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMainMenu();
</script>
</body>
</html>
