<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrooge Case - Тест мультиплеера</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
        body {
            background: #0a0a1a;
            color: white;
            font-family: system-ui;
            padding: 20px;
            text-align: center;
        }
        .player {
            background: #1a1a3a;
            margin: 10px;
            padding: 10px;
            border-radius: 16px;
        }
        button {
            background: #ffaa33;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            margin: 10px;
            cursor: pointer;
        }
        .bet-btn {
            background: #2a2a4a;
            color: white;
            margin: 5px;
            padding: 8px 16px;
        }
        .bet-btn.active {
            background: #ffaa33;
            color: black;
        }
    </style>
</head>
<body>
    <h1>🎡 Scrooge Case - Колесо Фортуны</h1>
    <div>⭐ Баланс: <span id="balance">1000</span> Stars</div>
    
    <div style="margin: 20px 0;">
        <button class="bet-btn" data-bet="10">10 ⭐</button>
        <button class="bet-btn" data-bet="25">25 ⭐</button>
        <button class="bet-btn" data-bet="50">50 ⭐</button>
        <button class="bet-btn" data-bet="100">100 ⭐</button>
    </div>
    
    <button id="joinBtn">🎲 ПРИСОЕДИНИТЬСЯ</button>
    <button id="raiseBtn">⬆️ ПОВЫСИТЬ СТАВКУ (+10)</button>
    <button id="startBtn">🚀 СТАРТ РАУНДА (10 сек)</button>
    
    <div id="timer" style="font-size: 32px; margin: 20px;"></div>
    <div id="playersList"></div>
    <div id="result"></div>
    
    <div id="fakeWins" style="margin-top: 30px; color: #ffd700;"></div>

<script>
    // Настройки
    const SOCKET_URL = 'http://192.168.31.84:3000';
    let socket = null;
    let currentBet = 10;
    let myName = 'Игрок_' + Math.floor(Math.random() * 1000);
    let balance = 1000;
    
    // Обновление баланса
    function updateBalance(amount) {
        balance += amount;
        document.getElementById('balance').innerText = balance;
    }
    
    // Подключение к серверу
    function connect() {
        socket = io(SOCKET_URL);
        
        socket.on('connect', () => {
            document.getElementById('result').innerHTML = '✅ Подключено к серверу!';
        });
        
        socket.on('wheel_update', (players) => {
            const container = document.getElementById('playersList');
            if (players.length === 0) {
                container.innerHTML = '<div>💎 Ожидание игроков...</div>';
            } else {
                container.innerHTML = players.map(p => 
                    `<div class="player">🎲 ${p.name} - Ставка: ${p.bet} ⭐</div>`
                ).join('');
            }
        });
        
        socket.on('wheel_timer', (time) => {
            document.getElementById('timer').innerHTML = time > 0 ? `⏱️ ${time} сек` : '🎡 ВРАЩЕНИЕ...';
        });
        
        socket.on('wheel_result', (data) => {
            document.getElementById('result').innerHTML = `🏆 ПОБЕДИТЕЛЬ: ${data.winner} (забрал ${data.prize} ⭐)!`;
            if (data.winner === myName) {
                updateBalance(data.prize);
            }
        });
        
        socket.on('fake_win', (msg) => {
            const winsDiv = document.getElementById('fakeWins');
            winsDiv.innerHTML = msg;
            setTimeout(() => {
                if (winsDiv.innerHTML === msg) winsDiv.innerHTML = '';
            }, 5000);
        });
    }
    
    connect();
    
    // Выбор ставки
    document.querySelectorAll('.bet-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.bet-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentBet = parseInt(btn.dataset.bet);
        };
    });
    
    // Присоединиться
    document.getElementById('joinBtn').onclick = () => {
        if (balance < currentBet) {
            alert('Недостаточно Stars!');
            return;
        }
        balance -= currentBet;
        document.getElementById('balance').innerText = balance;
        socket.emit('wheel_join', { name: myName, bet: currentBet });
        document.getElementById('result').innerHTML = `✅ Вы присоединились со ставкой ${currentBet} ⭐!`;
    };
    
    // Повысить ставку
    document.getElementById('raiseBtn').onclick = () => {
        if (balance < 10) {
            alert('Недостаточно Stars!');
            return;
        }
        balance -= 10;
        document.getElementById('balance').innerText = balance;
        socket.emit('wheel_raise', { newBet: currentBet + 10 });
        currentBet += 10;
        document.getElementById('result').innerHTML = `✅ Ставка повышена до ${currentBet} ⭐!`;
    };
    
    // Старт раунда
    document.getElementById('startBtn').onclick = () => {
        socket.emit('wheel_start');
        document.getElementById('result').innerHTML = '🚀 РАУНД НАЧАЛСЯ! 10 секунд...';
    };
</script>
</body>
</html>
