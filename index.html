<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scrooge Case</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: radial-gradient(circle at 20% 0%, #0a0a1a, #03030a);
            font-family: system-ui, 'Segoe UI', sans-serif;
            color: white;
            padding: 20px 16px 80px;
            min-height: 100vh;
        }
        .app {
            max-width: 600px;
            margin: 0 auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20,20,40,0.6);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 18px;
            margin-bottom: 24px;
        }
        .balance {
            background: rgba(0,0,0,0.7);
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
        }
        .stars { color: #ffd966; }
        .add-stars {
            background: linear-gradient(135deg, #ffaa33, #ff7733);
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: bold;
            color: #1a1a2a;
            cursor: pointer;
        }
        .game-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            border-radius: 60px;
        }
        .game-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
            background: rgba(255,255,255,0.05);
            cursor: pointer;
            font-weight: bold;
        }
        .game-tab.active {
            background: linear-gradient(135deg, #ffaa33, #ff7733);
            color: #1a1a2a;
        }
        .game-card {
            background: rgba(10,10,25,0.6);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 20px 0;
            aspect-ratio: 1;
        }
        .mine-cell {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            aspect-ratio: 1;
        }
        .mine-cell:active { transform: scale(0.92); }
        .mine-cell.revealed { background: #3a3a5a; }
        .mine-cell.mine {
            background: linear-gradient(145deg, #9b2c2c, #5a1010);
            animation: shake 0.3s;
        }
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff3366, #ff6633, #ffcc33, #33ff66, #33ccff, #ff3366);
            margin: 20px auto;
            transition: transform 3s cubic-bezier(0.33, 1, 0.68, 1);
        }
        .wheel.spinning { transform: rotate(1440deg); }
        .rocket {
            font-size: 64px;
            text-align: center;
            transition: 0.1s;
        }
        .rocket.flying {
            animation: fly 2s ease-out infinite;
        }
        @keyframes fly {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); opacity: 0; }
        }
        .btn {
            background: linear-gradient(95deg, #4a4aff, #2a2aff);
            border: none;
            padding: 12px 20px;
            border-radius: 44px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 4px;
        }
        .btn-cash { background: linear-gradient(95deg, #2ecc71, #27ae60); }
        input, select {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 28px;
            color: white;
            margin: 8px;
        }
        .participants-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            border-radius: 24px;
            padding: 12px;
            margin: 16px 0;
        }
        .participant {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 1000;
            transition: 0.2s;
            opacity: 0;
            pointer-events: none;
        }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">⭐ <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">➕ 500 Stars</button>
    </div>

    <div class="game-nav">
        <div class="game-tab active" data-game="mines">💣 Минное поле</div>
        <div class="game-tab" data-game="wheel">🎡 Колесо фортуны</div>
        <div class="game-tab" data-game="rocket">🚀 Ракетка</div>
    </div>

    <div id="gameContainer"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ----- Баланс -----
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`+${amount} Stars`);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('Недостаточно Stars!', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`Вы выиграли ${amount} Stars!`);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.background = isError ? '#aa2e2ecc' : '#1f3f2ecc';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ----- Игра 1: Минное поле -----
    let minesGame = {
        active: false,
        board: [],
        revealed: [],
        minesCount: 3,
        bet: 20,
        multiplier: 1,
        safeLeft: 0,
        currentBet: 0
    };
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) {
                newBoard[r][c] = -1;
                minesPlaced++;
            }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        renderMinesGame();
        showToast(`Игра началась! Ставка ${minesGame.bet} Stars`);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active) return;
        if (minesGame.revealed[row][col]) return;
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            showToast(`💥 Взорвались! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        const totalSafe = 25 - minesGame.minesCount;
        const opened = totalSafe - minesGame.safeLeft;
        minesGame.multiplier = 1 + (opened / totalSafe) * 4;
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! Выигрыш ${win} Stars!`);
        }
        renderMinesGame();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 Вы забрали ${win} Stars!`);
        renderMinesGame();
    }
    
    function renderMinesGame() {
        const container = document.getElementById('gameContainer');
        if (!minesGame.board.length) {
            container.innerHTML = `<div class="game-card">
                <h3>💣 Минное поле 5x5</h3>
                <div>⭐ Баланс: ${balance}</div>
                <div>Ставка: <input type="number" id="minesBet" min="20" value="${minesGame.bet}" ${minesGame.active ? 'disabled' : ''}> 
                Мин: <select id="minesCount" ${minesGame.active ? 'disabled' : ''}>
                    <option value="3" ${minesGame.minesCount===3 ? 'selected' : ''}>3 мины</option>
                    <option value="5" ${minesGame.minesCount===5 ? 'selected' : ''}>5 мин</option>
                    <option value="7" ${minesGame.minesCount===7 ? 'selected' : ''}>7 мин</option>
                </select></div>
                <button class="btn" id="startMinesBtn" ${minesGame.active ? 'disabled' : ''}>🚀 Новая игра</button>
            </div>`;
            document.getElementById('minesBet')?.addEventListener('change', (e) => minesGame.bet = Math.max(20, parseInt(e.target.value) || 20));
            document.getElementById('minesCount')?.addEventListener('change', (e) => minesGame.minesCount = parseInt(e.target.value));
            document.getElementById('startMinesBtn')?.addEventListener('click', initMinesGame);
            return;
        }
        let html = `<div class="game-card"><h3>💣 Минное поле 5x5</h3>`;
        html += `<div class="mines-grid">`;
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const val = minesGame.board[i][j];
                const isRevealed = minesGame.revealed[i][j];
                let content = '?';
                if (isRevealed) {
                    if (val === -1) content = '💣';
                    else if (val === 0) content = '✨';
                    else content = val;
                }
                html += `<div class="mine-cell ${isRevealed ? 'revealed' : ''}" onclick="revealMineCell(${i},${j})">${content}</div>`;
            }
        }
        html += `</div>`;
        html += `<button class="btn btn-cash" onclick="cashoutMines()">💰 Забрать (x${minesGame.multiplier.toFixed(2)})</button>`;
        html += `<div>Множитель: x${minesGame.multiplier.toFixed(2)} | Потенциальный выигрыш: ${Math.floor(minesGame.currentBet * minesGame.multiplier)} Stars</div>`;
        html += `</div>`;
        container.innerHTML = html;
    }
    
    // ----- Игра 2: Колесо фортуны (упрощённо) -----
    let wheelState = { active: false, myBet: 0, participants: [], timeLeft: 0, spinning: false, timer: null };
    
    function joinWheel() {
        if (wheelState.active) { showToast("Раунд уже идёт!", true); return; }
        const bet = parseInt(document.getElementById('wheelBet')?.value || 10);
        if (bet < 10) { showToast("Минимальная ставка 10 Stars", true); return; }
        if (!deductStars(bet)) return;
        wheelState.active = true;
        wheelState.myBet = bet;
        wheelState.participants = [{ name: 'Вы', bet: bet }];
        wheelState.timeLeft = 20;
        startWheelTimer();
        renderWheelGame();
        showToast(`Вы вошли со ставкой ${bet} Stars`);
    }
    
    function startWheelTimer() {
        if (wheelState.timer) clearInterval(wheelState.timer);
        wheelState.timer = setInterval(() => {
            wheelState.timeLeft--;
            renderWheelGame();
            if (wheelState.timeLeft <= 0) {
                clearInterval(wheelState.timer);
                spinWheelFinal();
            }
        }, 1000);
    }
    
    function spinWheelFinal() {
        if (wheelState.spinning) return;
        wheelState.spinning = true;
        renderWheelGame();
        setTimeout(() => {
            const total = wheelState.participants.reduce((s,p) => s + p.bet, 0);
            const winnerIdx = Math.floor(Math.random() * wheelState.participants.length);
            addWin(total);
            showToast(`🎡 Победитель: ${wheelState.participants[winnerIdx].name} (забрал ${total} Stars)`);
            wheelState.active = false;
            wheelState.spinning = false;
            wheelState.participants = [];
            renderWheelGame();
        }, 3000);
    }
    
    function renderWheelGame() {
        const container = document.getElementById('gameContainer');
        const total = wheelState.participants.reduce((s,p) => s + p.bet, 0);
        const myChance = total > 0 && wheelState.myBet ? (wheelState.myBet / total * 100).toFixed(1) : 0;
        let partsHtml = '<div class="participants-list">';
        wheelState.participants.forEach(p => {
            partsHtml += `<div class="participant"><span>${p.name}</span><span>⭐ ${p.bet}</span></div>`;
        });
        partsHtml += '</div>';
        container.innerHTML = `<div class="game-card">
            <h3>🎡 Колесо фортуны</h3>
            <div>⭐ Баланс: ${balance}</div>
            <div>Ставка: <input type="number" id="wheelBet" min="10" value="10" ${wheelState.active ? 'disabled' : ''}> Stars</div>
            <button class="btn" onclick="joinWheel()" ${wheelState.active ? 'disabled' : ''}>🎲 Вступить</button>
            ${wheelState.active ? `<div>⏱️ ${wheelState.timeLeft} сек | Ваш шанс: ${myChance}% (банк ${total} Stars)</div>` : ''}
            <div class="wheel ${wheelState.spinning ? 'spinning' : ''}"></div>
            ${partsHtml}
        </div>`;
    }
    
    // ----- Игра 3: Ракетка -----
    let rocketState = { active: false, bet: 50, multiplier: 1, target: 0, currentBet: 0, cashedOut: false, timer: null };
    
    function startRocket() {
        const bet = parseInt(document.getElementById('rocketBet')?.value || 50);
        if (bet < 50) { showToast("Минимальная ставка 50 Stars", true); return; }
        if (!deductStars(bet)) return;
        rocketState.active = true;
        rocketState.currentBet = bet;
        rocketState.multiplier = 1;
        rocketState.cashedOut = false;
        rocketState.target = +(Math.random() * 20 + 1.01).toFixed(2);
        if (rocketState.timer) clearInterval(rocketState.timer);
        rocketState.timer = setInterval(() => {
            rocketState.multiplier += 0.05;
            if (rocketState.multiplier >= rocketState.target) {
                clearInterval(rocketState.timer);
                rocketState.active = false;
                showToast(`💥 Ракета взорвалась на x${rocketState.target.toFixed(2)}!`, true);
                renderRocketGame();
            }
            renderRocketGame();
        }, 100);
        renderRocketGame();
        showToast(`Ракета летит! Цель ~x${rocketState.target.toFixed(2)}`);
    }
    
    function cashoutRocket() {
        if (!rocketState.active || rocketState.cashedOut) return;
        clearInterval(rocketState.timer);
        const win = Math.floor(rocketState.currentBet * rocketState.multiplier);
        addWin(win);
        rocketState.active = false;
        rocketState.cashedOut = true;
        showToast(`💰 Вы забрали ${win} Stars (x${rocketState.multiplier.toFixed(2)})`);
        renderRocketGame();
    }
    
    function renderRocketGame() {
        const container = document.getElementById('gameContainer');
        container.innerHTML = `<div class="game-card">
            <h3>🚀 Ракетка</h3>
            <div>⭐ Баланс: ${balance}</div>
            <div>Ставка: <input type="number" id="rocketBet" min="50" value="${rocketState.bet}" ${rocketState.active ? 'disabled' : ''}> Stars</div>
            <button class="btn" onclick="startRocket()" ${rocketState.active ? 'disabled' : ''}>🚀 Запустить</button>
            ${rocketState.active ? `<button class="btn btn-cash" onclick="cashoutRocket()">💰 Забрать (x${rocketState.multiplier.toFixed(2)})</button>` : ''}
            <div class="rocket-area">
                <div class="rocket ${rocketState.active ? 'flying' : ''}">🚀</div>
                <div>Текущий коэффициент: <strong>x${rocketState.multiplier.toFixed(2)}</strong></div>
                ${rocketState.active ? `<div>Потенциальный выигрыш: ${Math.floor(rocketState.currentBet * rocketState.multiplier)} Stars</div>` : ''}
            </div>
        </div>`;
    }
    
    // ----- Навигация -----
    let currentGame = 'mines';
    function switchGame(game) {
        currentGame = game;
        document.querySelectorAll('.game-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.game === game);
        });
        if (game === 'mines') renderMinesGame();
        else if (game === 'wheel') renderWheelGame();
        else if (game === 'rocket') renderRocketGame();
    }
    
    document.querySelectorAll('.game-tab').forEach(tab => {
        tab.onclick = () => switchGame(tab.dataset.game);
    });
    
    // Глобальные функции для onclick
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    window.joinWheel = joinWheel;
    window.startRocket = startRocket;
    window.cashoutRocket = cashoutRocket;
    
    // Инициализация Telegram
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMinesGame();
</script>
</body>
</html>
