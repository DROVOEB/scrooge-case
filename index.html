<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Scrooge Case — Luxury Casino</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --gold: #ffd700;
            --gold-dark: #b8860b;
            --gold-light: #ffe066;
            --gold-glow: rgba(255, 215, 0, 0.4);
            --dark: #0a0a0f;
            --card-bg: rgba(15, 12, 10, 0.75);
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            padding: 20px;
            min-height: 100vh;
            background: #0a0505;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 30% 40%, #1a0f0a 0%, #0a0505 100%);
            z-index: -2;
        }

        .floating-coins {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .coin {
            position: absolute;
            font-size: 24px;
            opacity: 0.15;
            animation: floatCoin linear infinite;
        }

        @keyframes floatCoin {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-50px) rotate(360deg); opacity: 0; }
        }

        .glitter {
            position: fixed;
            width: 2px;
            height: 2px;
            background: #ffd700;
            border-radius: 50%;
            opacity: 0;
            animation: glitterPulse 2s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes glitterPulse {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.5; transform: scale(1); }
        }

        .app {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.8), rgba(20, 12, 8, 0.9));
            backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 8px 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .top-bar::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .balance {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5), 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .balance span {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .add-stars {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 800;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .add-stars::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .add-stars:active::before {
            width: 200px;
            height: 200px;
        }

        .add-stars:active {
            transform: scale(0.95);
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 600;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            transform: translateX(-5px);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
            margin-top: 20px;
        }

        .game-menu-card {
            position: relative;
            background: linear-gradient(145deg, rgba(25, 18, 14, 0.95), rgba(15, 10, 8, 0.98));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 34px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 215, 0, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .game-menu-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 48px;
            padding: 2px;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-menu-card:hover::before {
            opacity: 1;
        }

        .game-menu-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(255, 215, 0, 0.2);
        }

        .game-menu-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.3));
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .game-menu-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .game-menu-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .game-menu-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 170, 0, 0.15));
            border-radius: 60px;
            padding: 10px 24px;
            font-size: 13px;
            font-weight: 700;
            color: #ffd700;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .game-menu-card[data-game="mines"] .game-menu-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            font-weight: 800;
        }

        .game-card {
            background: linear-gradient(145deg, rgba(20, 15, 12, 0.85), rgba(12, 8, 6, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 28px 24px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .game-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            letter-spacing: 1px;
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
            color: rgba(255, 215, 0, 0.6);
            margin-bottom: 16px;
            text-align: center;
        }

        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            justify-content: center;
        }

        .bet-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.12), rgba(255, 170, 0, 0.06));
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 15px;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            transform: scale(1.02);
        }

        .info-panel {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            border-radius: 32px;
            padding: 20px;
            margin: 24px 0;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .coefficient-display {
            font-size: 60px;
            font-weight: 800;
            text-align: center;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 20px 0;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .potential-win {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .timer-display {
            font-size: 56px;
            font-weight: 800;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin: 20px 0;
            font-family: monospace;
        }

        .participants-list {
            max-height: 250px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 28px;
            padding: 12px;
            margin: 16px 0;
            scrollbar-width: thin;
            scrollbar-color: #ffd700 #333;
        }

        .participants-list::-webkit-scrollbar {
            width: 4px;
        }

        .participants-list::-webkit-scrollbar-track {
            background: #333;
            border-radius: 4px;
        }

        .participants-list::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 4px;
        }

        .participant {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            font-size: 14px;
            transition: all 0.2s;
        }

        .participant:hover {
            background: rgba(255, 215, 0, 0.05);
        }

        .participant-real {
            background: rgba(255, 215, 0, 0.08);
            border-left: 3px solid #ffd700;
            border-radius: 12px;
            margin: 2px 0;
        }

        .participant-avatar {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 10px;
        }

        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .wheel-canvas-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            transition: all 0.3s;
        }

        canvas:hover {
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.5);
        }

        .wheel-pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 45px solid #ffd700;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.5));
            z-index: 10;
        }

        .wheel-pointer::after {
            content: "▼";
            position: absolute;
            top: -52px;
            left: -14px;
            font-size: 28px;
            color: #ffd700;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 800;
            color: #1a1a1a;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cash {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(30, 20, 15, 0.95));
            backdrop-filter: blur(20px);
            padding: 14px 28px;
            border-radius: 60px;
            z-index: 1000;
            transition: 0.25s;
            opacity: 0;
            pointer-events: none;
            font-weight: 600;
            border: 1px solid #ffd700;
            white-space: nowrap;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 24px 0;
            aspect-ratio: 1;
        }

        .mine-cell {
            background: linear-gradient(145deg, rgba(40, 30, 25, 0.95), rgba(25, 18, 14, 0.98));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            cursor: pointer;
            transition: all 0.2s;
            aspect-ratio: 1;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 215, 0, 0.2);
            position: relative;
        }

        .mine-cell:active {
            transform: scale(0.92);
        }

        .mine-cell.safe {
            background: linear-gradient(145deg, rgba(46, 204, 113, 0.25), rgba(39, 174, 96, 0.15));
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.3);
        }

        .mine-cell.mine-revealed {
            background: linear-gradient(145deg, #9b2c2c, #5a1010);
            animation: mineExplode 0.4s ease-out forwards;
        }

        @keyframes mineExplode {
            0% { transform: scale(1); background: #ff6600; }
            30% { transform: scale(1.2); background: #ff3300; }
            100% { transform: scale(1); background: #5a1010; }
        }

        @media (max-width: 550px) {
            .games-grid { gap: 20px; }
            .game-menu-icon { font-size: 60px; }
            .game-menu-title { font-size: 26px; }
            .timer-display { font-size: 42px; }
            .coefficient-display { font-size: 48px; }
            .mine-cell { font-size: 28px; }
            canvas { width: 280px; height: 280px; }
            .participant { font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="floating-coins" id="floatingCoins"></div>
<div class="app">
   <div class="top-bar">
    <div class="balance">💎 <span id="balance">1000</span> Stars</div>
    <div class="buy-stars-buttons">
        <button class="buy-star" onclick="buyStars(100)">100 ⭐</button>
        <button class="buy-star" onclick="buyStars(250)">250 ⭐</button>
        <button class="buy-star" onclick="buyStars(500)">500 ⭐</button>
        <button class="buy-star" onclick="buyStars(1000)">1000 ⭐</button>
    </div>
</div>
    <div id="mainContent"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== ПЛАВАЮЩИЕ МОНЕТЫ ==========
    function createFloatingCoins() {
        const container = document.getElementById('floatingCoins');
        const coins = ['💰', '💎', '🪙', '💵'];
        for (let i = 0; i < 35; i++) {
            const coin = document.createElement('div');
            coin.className = 'coin';
            coin.textContent = coins[Math.floor(Math.random() * coins.length)];
            coin.style.left = Math.random() * 100 + '%';
            coin.style.fontSize = (Math.random() * 20 + 15) + 'px';
            coin.style.animationDuration = (Math.random() * 8 + 5) + 's';
            coin.style.animationDelay = Math.random() * 10 + 's';
            container.appendChild(coin);
        }
        for (let i = 0; i < 70; i++) {
            const glitter = document.createElement('div');
            glitter.className = 'glitter';
            glitter.style.left = Math.random() * 100 + '%';
            glitter.style.top = Math.random() * 100 + '%';
            glitter.style.animationDelay = Math.random() * 3 + 's';
            glitter.style.animationDuration = (Math.random() * 2 + 1) + 's';
            document.body.appendChild(glitter);
        }
    }
    createFloatingCoins();
    
    // ========== РЕАЛЬНОЕ ПОПОЛНЕНИЕ TELEGRAM STARS ==========
    function openTelegramStarsInvoice() {
        if (window.Telegram?.WebApp) {
            // Telegram Stars — встроенная покупка
            const starsAmount = 500;
            const price = starsAmount; // 1 Star = 0.01 USD примерно
            Telegram.WebApp.openInvoice(`stars_${starsAmount}_${Date.now()}`, {
                title: `${starsAmount} Telegram Stars`,
                description: `Пополнение баланса на ${starsAmount} Stars`,
                payload: JSON.stringify({ action: 'add_stars', amount: starsAmount }),
                provider_token: '', // Telegram Stars не требует provider_token
                currency: 'XTR',
                prices: [{ label: `${starsAmount} Stars`, amount: price * 100 }]
            });
        } else {
            // Демо-режим для тестирования в браузере
            showToast('⭐ Демо-пополнение: +500 Stars (в Telegram будет через Stars)', false);
            addStars(500);
        }
    }
    
    // Обработчик покупки через Telegram
    if (window.Telegram?.WebApp) {
        Telegram.WebApp.onEvent('invoiceClosed', (event) => {
            if (event.status === 'paid') {
                try {
                    const data = JSON.parse(event.payload);
                    if (data.action === 'add_stars') {
                        addStars(data.amount);
                        showToast(`⭐ Пополнение: +${data.amount} Stars!`, false);
                    }
                } catch(e) {}
            }
        });
    }
    
    // ========== БАЛАНС ==========
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`✨ ПОПОЛНЕНИЕ: +${amount} Stars ✨`, false);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ НЕДОСТАТОЧНО СРЕДСТВ! Пополните баланс.', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🏆 ПОБЕДА! ВЫИГРЫШ ${amount} Stars! 🏆`, false);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.borderColor = isError ? '#e74c3c' : '#ffd700';
        setTimeout(() => toast.style.opacity = '0', 2500);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = openTelegramStarsInvoice;
    
    // ========== ПРОДВИНУТЫЙ ГЕНЕРАТОР ФЕЙК-ИГРОКОВ ==========
    const firstNames = ['Alex', 'Max', 'Leo', 'Dan', 'Sam', 'Tom', 'Nick', 'Mike', 'John', 'Chris', 'Kevin', 'Brian', 'Jason', 'Eric', 'Adam', 'David', 'Paul', 'Mark', 'Steve', 'Andrew', 'Vlad', 'Igor', 'Dmitry', 'Sergey', 'Anton', 'Roman', 'Ivan', 'Mikhail', 'Nikita', 'Artem'];
    const lastNames = ['Crypto', 'Winner', 'Lucky', 'Player', 'Gamer', 'Hunter', 'Killer', 'Master', 'Pro', 'Star', 'King', 'Queen', 'Ace', 'Wolf', 'Fox', 'Hawk', 'Eagle', 'Shark', 'Dragon', 'Phoenix', 'Rich', 'Gold', 'Diamond', 'Legend', 'Hero', 'Champ', 'Boss', 'Elite', 'Crown', 'Royal'];
    const suffixes = ['_99', 'X', 'Pro', '007', '_xXx', '2024', '777', 'Gold', 'Diamond', 'Platinum', 'VIP', 'OG', 'MVP', 'LTD'];
    const avatars = ['🐺', '🦊', '🐉', '🦅', '🦁', '🐯', '🐎', '🦄', '🐧', '🐸', '🐙', '🦭', '🦚', '🦜', '🐳'];
    
    function generateRandomNick() {
        const useFirstName = Math.random() > 0.35;
        if (useFirstName) {
            const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            const useSuffix = Math.random() > 0.65;
            if (useSuffix) {
                return `${firstName}${lastName}${suffixes[Math.floor(Math.random() * suffixes.length)]}`;
            }
            return `${firstName}${lastName}`;
        } else {
            const prefixes = ['Cool', 'Fast', 'Big', 'Little', 'Dark', 'Light', 'Fire', 'Ice', 'Thunder', 'Storm', 'High', 'Low', 'Crypto', 'Mega', 'Ultra', 'Super'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            const number = Math.floor(Math.random() * 9000) + 1000;
            return `${prefix}_${number}`;
        }
    }
    
    function generateRandomAvatar() {
        return avatars[Math.floor(Math.random() * avatars.length)];
    }
    
    function generateRandomBet(min, max) {
        const bets = [10, 15, 20, 25, 30, 40, 45, 50, 60, 75, 80, 90, 100, 110, 120, 125, 130, 140, 150, 160, 175, 180, 190, 200, 210, 220, 230, 240, 250, 260, 275, 280, 290, 300, 320, 340, 350, 360, 370, 380, 390, 400, 420, 440, 450, 460, 470, 480, 490, 500];
        const available = bets.filter(b => b >= min && b <= max);
        if (available.length === 0) return min;
        return available[Math.floor(Math.random() * available.length)];
    }
    
    let fakePlayersTimers = {};
    let fakePlayersActive = {};
    
    function addFakePlayer(game, participants, maxBet, existingNames) {
        const nick = generateRandomNick();
        if (existingNames.includes(nick)) return false;
        const avatar = generateRandomAvatar();
        const bet = generateRandomBet(10, maxBet);
        participants.push({ 
            name: nick, 
            bet: bet, 
            avatar: avatar,
            isFake: true,
            cashedOut: false
        });
        return true;
    }
    
    function raiseFakeBet(participants, maxBet) {
        const fakeParticipants = participants.filter(p => p.isFake && !p.cashedOut);
        if (fakeParticipants.length === 0) return false;
        const randomFake = fakeParticipants[Math.floor(Math.random() * fakeParticipants.length)];
        const increase = [10, 15, 20, 25, 30, 35, 40, 45, 50][Math.floor(Math.random() * 9)];
        const newBet = Math.min(randomFake.bet + increase, maxBet);
        if (newBet > randomFake.bet) {
            randomFake.bet = newBet;
            return true;
        }
        return false;
    }
    
    function startFakePlayersGenerator(gameId, getParticipants, maxBet, stopCondition) {
        if (fakePlayersTimers[gameId]) clearInterval(fakePlayersTimers[gameId]);
        if (fakePlayersActive[gameId]) return;
        fakePlayersActive[gameId] = true;
        
        const generate = () => {
            if (stopCondition && stopCondition()) {
                fakePlayersActive[gameId] = false;
                return;
            }
            
            const participants = getParticipants();
            const existingNames = participants.map(p => p.name);
            
            const action = Math.random();
            
            if (participants.filter(p => p.isFake).length < 12) {
                if (action < 0.6) {
                    addFakePlayer(gameId, participants, maxBet, existingNames);
                } else if (action < 0.85 && participants.filter(p => p.isFake && !p.cashedOut).length > 0) {
                    raiseFakeBet(participants, maxBet);
                }
            } else if (action < 0.7 && participants.filter(p => p.isFake && !p.cashedOut).length > 2) {
                raiseFakeBet(participants, maxBet);
            }
            
            if (fakePlayersActive[gameId]) {
                fakePlayersTimers[gameId] = setTimeout(generate, 2500 + Math.random() * 4000);
            }
        };
        
        fakePlayersTimers[gameId] = setTimeout(generate, 1500);
    }
    
    function stopFakePlayersGenerator(gameId) {

            clearTimeout(fakePlayersTimers[gameId]);

    const wheelColors = ['#ff3366', '#ff6633', '#ffcc33', '#33ff66', '#33ccff', '#9b59b6', '#e74c3c', '#3498db', '#1abc9c', '#f39c12', '#2ecc71', '#e67e22'];
    
    function drawWheel() {
        if (!wheelGame.canvas || !wheelGame.ctx) return;
        const ctx = wheelGame.ctx;
        const canvas = wheelGame.canvas;
        const size = canvas.width;
        const center = size / 2;
        const radius = size / 2 - 5;
        
        ctx.clearRect(0, 0, size, size);
        
        if (wheelGame.participants.length === 0) {
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(30,25,20,0.8)';
            ctx.fill();
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 14px Poppins';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('НЕТ СТАВОК', center, center);
            return;
        }
        
        const totalBet = wheelGame.participants.reduce((sum, p) => sum + p.bet, 0);
        let startAngle = wheelGame.currentAngle;
        
        for (let i = 0; i < wheelGame.participants.length; i++) {
            const p = wheelGame.participants[i];
            const angle = (p.bet / totalBet) * 2 * Math.PI;
            const endAngle = startAngle + angle;
            
            ctx.beginPath();
            ctx.arc(center, center, radius, startAngle, endAngle);
            ctx.lineTo(center, center);
            ctx.fillStyle = wheelColors[i % wheelColors.length];
            ctx.fill();
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(startAngle + angle / 2);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 10px Poppins';
            ctx.shadowBlur = 0;
            let name = p.name.length > 12 ? p.name.slice(0, 10) + '..' : p.name;
            ctx.fillText(name, radius - 35, 5);
            ctx.restore();
            
            startAngle = endAngle;
        }
        
        ctx.beginPath();
        ctx.arc(center, center, 28, 0, 2 * Math.PI);
        ctx.fillStyle = '#1a1a1a';
        ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 22px Poppins';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💰', center, center);
        
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.stroke();
    }
    
    function spinWheel() {
        if (wheelGame.spinning) return;
        const totalBet = wheelGame.participants.reduce((sum, p) => sum + p.bet, 0);
        if (totalBet === 0) return;
        
        wheelGame.spinning = true;
        
        const randomValue = Math.random() * totalBet;
        let cumulative = 0;
        let winnerIndex = 0;
        for (let i = 0; i < wheelGame.participants.length; i++) {
            cumulative += wheelGame.participants[i].bet;
            if (randomValue <= cumulative) {
                winnerIndex = i;
                break;
            }
        }
        const winner = wheelGame.participants[winnerIndex];
        
        const targetSegmentCenter = (2 * Math.PI * (randomValue / totalBet)) - (wheelGame.participants[winnerIndex].bet / totalBet * Math.PI);
        const targetAngle = (Math.PI / 2) - targetSegmentCenter;
        const spins = 360 * 5;
        const finalAngle = targetAngle + (spins * Math.PI / 180);
        
        wheelGame.targetAngle = finalAngle;
        
        let startTime = null;
        const duration = 3000;
        
        function animateSpin(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(1, elapsed / duration);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            
            wheelGame.currentAngle = (wheelGame.currentAngle + (finalAngle - wheelGame.currentAngle) * easeOut) % (2 * Math.PI);
            drawWheel();
            
            if (progress < 1) {
                wheelGame.animationId = requestAnimationFrame(animateSpin);
            } else {
                wheelGame.currentAngle = finalAngle % (2 * Math.PI);
                drawWheel();
                wheelGame.spinning = false;
                
                addWin(totalBet);
                showToast(`🎡 ПОБЕДИТЕЛЬ: ${winner.name} 🎡 (забрал ${totalBet.toLocaleString()} Stars)!`, false);
                
                wheelGame.active = false;
                wheelGame.countingDown = false;
                wheelGame.myBetPlaced = false;
                wheelGame.participants = [];
                stopFakePlayersGenerator('wheel');
                renderWheelGame();
            }
        }
        
        if (wheelGame.animationId) cancelAnimationFrame(wheelGame.animationId);
        wheelGame.animationId = requestAnimationFrame(animateSpin);
    }
    
    function startWheelCountdown() {
        if (wheelGame.countdownInterval) clearInterval(wheelGame.countdownInterval);
        wheelGame.countingDown = true;
        wheelGame.countdown = 10;
        wheelGame.myBetPlaced = false;
        wheelGame.participants = [];
        wheelGame.spinning = false;
        wheelGame.currentAngle = 0;
        drawWheel();
        renderWheelGame();
        
        startFakePlayersGenerator('wheel', () => wheelGame.participants, 2500, () => !wheelGame.countingDown);
        
        wheelGame.countdownInterval = setInterval(() => {
            wheelGame.countdown--;
            renderWheelGame();
            
            if (wheelGame.countdown <= 0) {
                clearInterval(wheelGame.countdownInterval);

                if (wheelGame.participants.length === 0) {
                    showToast('Нет участников! Начните новый раунд', true);

                } else {

    // ========== ИГРА: МИННОЕ ПОЛЕ ==========
    let minesGame = {
        active: false, board: [], revealed: [], minesCount: 3, bet: 50,
        multiplier: 1, safeLeft: 0, currentBet: 0, cellsRevealed: 0, maxMultiplier: 0
    };
    
    function getBaseMultiplier(minesCount) {
        return {3: 3.5, 5: 6.5, 7: 11.0}[minesCount] || 3.5;
    }
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        minesGame.cellsRevealed = 0;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) { newBoard[r][c] = -1; minesPlaced++; }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`💎 Игра началась! Ставка ${minesGame.bet} Stars`, false);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active || minesGame.revealed[row][col]) return;
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        const totalSafe = 25 - minesGame.minesCount;
        const progress = minesGame.cellsRevealed / totalSafe;
        minesGame.multiplier = +(1 + (minesGame.maxMultiplier - 1) * Math.pow(progress, 1.2)).toFixed(2);
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! ${win} Stars!`, false);
            renderMinesGame();
            return;
        }
        renderMinesGame();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 ЗАБРАНО ${win} Stars!`, false);
        renderMinesGame();
    }

        if (!minesGame.active || !minesGame.board.length) {

                    <div class="bet-buttons">
                        <button class="bet-btn ${minesGame.minesCount === 3 ? 'active' : ''}" data-mines="3">3 мины (x3.5)</button>
                        <button class="bet-btn ${minesGame.minesCount === 5 ? 'active' : ''}" data-mines="5">5 мин (x6.5)</button>
                        <button class="bet-btn ${minesGame.minesCount === 7 ? 'active' : ''}" data-mines="7">7 мин (x11.0)</button>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>⭐ СТАВКА</span><span>${minesGame.bet} STARS</span></div>
                        <div class="info-row"><span>🏆 МАКС. МНОЖИТЕЛЬ</span><span>x${getBaseMultiplier(minesGame.minesCount)}</span></div>
                    </div>
                    <button class="btn" id="startMinesBtn">💎 НАЧАТЬ ИГРУ</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn[data-bet]').forEach(btn => {
                btn.onclick = () => { minesGame.bet = parseInt(btn.dataset.bet); renderMinesGame(); };
            });
            document.querySelectorAll('.bet-btn[data-mines]').forEach(btn => {
                btn.onclick = () => { minesGame.minesCount = parseInt(btn.dataset.mines); renderMinesGame(); };
            });
            document.getElementById('startMinesBtn').onclick = initMinesGame;
            return;
        }
        
        let gridHtml = '<div class="mines-grid">';
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const isRevealed = minesGame.revealed[i][j];
                let content = '💎', addClass = '';
                if (isRevealed) {
                    if (minesGame.board[i][j] === -1) { content = '💣'; addClass = 'mine-revealed'; }
                    else { content = '💎'; addClass = 'safe'; }
                }
                gridHtml += `<div class="mine-cell ${addClass}" onclick="window.revealMineCell(${i},${j})">${content}</div>`;
            }
        }
        gridHtml += '</div>';
        
        const totalSafe = 25 - minesGame.minesCount;
        const progress = Math.floor((minesGame.cellsRevealed / totalSafe) * 100);
        const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
        
        container.innerHTML = `
            <div class="game-card">
                <div class="game-title">💎 MINES | ${minesGame.minesCount} MINES</div>
                ${gridHtml}
                <div class="info-panel">
                    <div class="info-row"><span>🎯 ПРОГРЕСС</span><span>${progress}%</span></div>
                    <div class="info-row"><span>💎 БЕЗОПАСНО</span><span>${minesGame.safeLeft} / ${totalSafe}</span></div>
                    <div class="coefficient-display" style="font-size:42px;">x${minesGame.multiplier}</div>
                    <div class="potential-win">💰 ЗАБРАТЬ: ${potentialWin.toLocaleString()} STARS</div>
                </div>
                <button class="btn btn-cash" onclick="window.cashoutMines()">💰 ЗАБРАТЬ ВЫИГРЫШ</button>
            </div>
        `;
    }
    
    // ========== ИГРА: РАКЕТКА ==========
    let rocketGame = {
        active: false,
        countingDown: false,
        countdown: 10,
        bet: 50,
        currentBet: 0,
        multiplier: 1.00,
        targetMultiplier: 1.00,
        interval: null,
        countdownInterval: null,
        cashedOut: false,
        participants: [],
        myBetPlaced: false
    };
    
    function startRocketCountdown() {
        if (rocketGame.countdownInterval) clearInterval(rocketGame.countdownInterval);
        rocketGame.countingDown = true;
        rocketGame.countdown = 10;
        rocketGame.myBetPlaced = false;
        rocketGame.participants = [];
        renderRocketGame();
        
        startFakePlayersGenerator('rocket', () => rocketGame.participants, 5000, () => !rocketGame.countingDown);
        
        rocketGame.countdownInterval = setInterval(() => {
            rocketGame.countdown--;
            renderRocketGame();
            
            if (rocketGame.countdown <= 0) {
                clearInterval(rocketGame.countdownInterval);
                rocketGame.countingDown = false;
                stopFakePlayersGenerator('rocket');
                if (rocketGame.participants.length === 0) {
                    showToast('Нет участников! Начните новый раунд', true);
                    renderRocketGame();
                } else {
                    startRocketFlight();
                }
            }
        }, 1000);
    }
    
    function placeRocketBet() {
        if (!rocketGame.countingDown) {
            showToast('Нет активного раунда! Нажмите "НОВЫЙ РАУНД"', true);
            return;
        }
        if (rocketGame.myBetPlaced) {
            showToast('Вы уже сделали ставку!', true);
            return;
        }
        if (rocketGame.bet < 50) {
            showToast('Минимальная ставка 50 Stars', true);
            return;
        }
        if (!deductStars(rocketGame.bet)) return;
        
        rocketGame.myBetPlaced = true;
        rocketGame.currentBet = rocketGame.bet;
        rocketGame.participants.push({ name: 'ВЫ', bet: rocketGame.bet, avatar: '👑', isFake: false, cashedOut: false });
        
        renderRocketGame();
        showToast(`✅ Ставка ${rocketGame.bet} Stars принята!`, false);
    }
    
    function startRocketFlight() {
        rocketGame.active = true;
        rocketGame.multiplier = 1.00;
        rocketGame.cashedOut = false;
        rocketGame.targetMultiplier = +(Math.random() * (28.5) + 1.5).toFixed(2);
        
        if (rocketGame.interval) clearInterval(rocketGame.interval);
        rocketGame.interval = setInterval(() => {
            if (!rocketGame.active) return;
            const increment = 0.02 + Math.random() * 0.03;
            rocketGame.multiplier = +(rocketGame.multiplier + increment).toFixed(2);
            
            if (rocketGame.multiplier >= rocketGame.targetMultiplier) {
                clearInterval(rocketGame.interval);
                rocketGame.active = false;
                showToast(`💥 РАКЕТА ВЗОРВАЛАСЬ на x${rocketGame.multiplier}!`, true);
                stopFakePlayersGenerator('rocket');
                renderRocketGame();
            } else {
                renderRocketGame();
            }
        }, 70);
        
        renderRocketGame();
        showToast(`🚀 Ракета взлетает!`, false);
    }
    
    function cashoutRocket() {
        if (!rocketGame.active) {
            showToast('Нет активного полёта!', true);
            return;
        }
        if (rocketGame.cashedOut) {
            showToast('Вы уже забрали выигрыш!', true);
            return;
        }
        const win = Math.floor(rocketGame.currentBet * rocketGame.multiplier);
        addWin(win);
        rocketGame.cashedOut = true;
        showToast(`💰 ВЫ ЗАБРАЛИ ${win} Stars (x${rocketGame.multiplier})!`, false);
        renderRocketGame();
    }
    
    function newRocketRound() {
        if (rocketGame.active || rocketGame.countingDown) {
            showToast('Дождитесь окончания текущего раунда!', true);
            return;
        }
        if (rocketGame.interval) clearInterval(rocketGame.interval);
        if (rocketGame.countdownInterval) clearInterval(rocketGame.countdownInterval);
        rocketGame.active = false;
        rocketGame.countingDown = false;
        rocketGame.cashedOut = false;
        rocketGame.myBetPlaced = false;
        rocketGame.currentBet = 0;
        rocketGame.participants = [];
        startRocketCountdown();
    }
    
    function renderRocketGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        const totalBet = rocketGame.participants.reduce((sum, p) => sum + p.bet, 0);
        let participantsHtml = '<div class="participants-list">';
        if (rocketGame.participants.length === 0) {
            participantsHtml += '<div style="text-align:center; padding:12px; opacity:0.6;">💎 ОЖИДАНИЕ СТАВОК 💎</div>';
        } else {
            rocketGame.participants.forEach(p => {
                const isReal = p.name === 'ВЫ';
                participantsHtml += `<div class="participant ${isReal ? 'participant-real' : ''}">
                    <span><span class="participant-avatar">${p.avatar || '🚀'}</span> <strong>${p.name}</strong></span>
                    <span>⭐ ${p.bet.toLocaleString()} ${p.cashedOut ? '✅' : ''}</span>
                </div>`;
            });
        }
        participantsHtml += '</div>';
        
        if (rocketGame.countingDown) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">🚀 ROCKET 🚀</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${rocketGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="timer-display">⏱️ ${rocketGame.countdown} сек</div>
                    ${participantsHtml}
                    <div class="info-panel">
                        <div class="info-row"><span>💰 СТАВКА</span><span>${rocketGame.bet} STARS</span></div>
                        <div class="info-row"><span>🚀 МАКС. ВЫИГРЫШ</span><span>до x30</span></div>
                        ${rocketGame.myBetPlaced ? '<div class="potential-win">✅ ВАША СТАВКА ПРИНЯТА! Ждите старта...</div>' : '<div class="potential-win">💎 СДЕЛАЙТЕ СТАВКУ ДО КОНЦА ОТСЧЁТА 💎</div>'}
                    </div>
                    <button class="btn" id="placeRocketBetBtn" ${rocketGame.myBetPlaced ? 'disabled' : ''}>🚀 СДЕЛАТЬ СТАВКУ</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { rocketGame.bet = parseInt(btn.dataset.bet); renderRocketGame(); };
            });
            document.getElementById('placeRocketBetBtn').onclick = placeRocketBet;
            return;
        }
        
        if (!rocketGame.active && !rocketGame.countingDown) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">🚀 ROCKET 🚀</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${rocketGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>💰 СТАВКА</span><span>${rocketGame.bet} STARS</span></div>
                        <div class="info-row"><span>🚀 МАКС. ВЫИГРЫШ</span><span>до x30</span></div>
                    </div>
                    <button class="btn" id="newRocketRoundBtn">🚀 НОВЫЙ РАУНД (10 сек)</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { rocketGame.bet = parseInt(btn.dataset.bet); renderRocketGame(); };
            });
            document.getElementById('newRocketRoundBtn').onclick = newRocketRound;
            return;
        }
        
        const potentialWin = Math.floor(rocketGame.currentBet * rocketGame.multiplier);
        container.innerHTML = `
            <div class="game-card">
                <div class="game-title">🚀 ROCKET IN FLIGHT 🚀</div>
                <div class="coefficient-display">x${rocketGame.multiplier}</div>
                ${participantsHtml}
                <div class="info-panel">
                    <div class="info-row"><span>💎 ВАША СТАВКА</span><span>${rocketGame.currentBet} STARS</span></div>
                    <div class="info-row"><span>🎯 ТЕКУЩИЙ МНОЖИТЕЛЬ</span><span>x${rocketGame.multiplier}</span></div>
                    <div class="potential-win">💰 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: ${potentialWin.toLocaleString()} STARS</div>
                </div>
                <button class="btn btn-cash" id="cashoutRocketBtn" ${rocketGame.cashedOut ? 'disabled' : ''}>🚀 ЗАБРАТЬ ВЫИГРЫШ</button>
            </div>
        `;
        document.getElementById('cashoutRocketBtn').onclick = cashoutRocket;
    }
    
    // ========== ГЛАВНОЕ МЕНЮ ==========
    function renderMainMenu() {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <div class="games-grid">
                <div class="game-menu-card" data-game="mines">
                    <div class="game-menu-icon">💎</div>
                    <div class="game-menu-title">MINES</div>
                    <div class="game-menu-desc">Классическое минное поле. Открывай кристаллы, избегай мин и увеличивай множитель до x11!</div>
                    <div class="game-menu-badge">🔥 ПОПУЛЯРНОЕ</div>
                </div>
                <div class="game-menu-card" data-game="wheel">
                    <div class="game-menu-icon">🎡</div>
                    <div class="game-menu-title">FORTUNE WHEEL</div>
                    <div class="game-menu-desc">Колесо фортуны. Делай ставку, повышай, крути колесо и забирай банк!</div>
                    <div class="game-menu-badge">🎡 АКТИВНА</div>
                </div>
                <div class="game-menu-card" data-game="rocket">
                    <div class="game-menu-icon">🚀</div>
                    <div class="game-menu-title">ROCKET</div>
                    <div class="game-menu-desc">Ракетка. Лети выше, лови момент и забирай выигрыш до x30!</div>
                    <div class="game-menu-badge">🚀 АКТИВНА</div>
                </div>
            </div>
        `;
        
        document.querySelectorAll('.game-menu-card').forEach(card => {
            card.onclick = () => openGame(card.dataset.game);
        });
    }
    
    function openGame(gameId) {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `<button class="back-btn" id="backToMenuBtn">← ВЕРНУТЬСЯ В МЕНЮ</button><div id="gameContent"></div>`;
        document.getElementById('backToMenuBtn').onclick = () => {
            if (rocketGame.interval) clearInterval(rocketGame.interval);
            if (rocketGame.countdownInterval) clearInterval(rocketGame.countdownInterval);
            if (wheelGame.countdownInterval) clearInterval(wheelGame.countdownInterval);
            if (wheelGame.animationId) cancelAnimationFrame(wheelGame.animationId);
            stopFakePlayersGenerator('wheel');
            stopFakePlayersGenerator('rocket');
            rocketGame.active = false;
            rocketGame.countingDown = false;
            wheelGame.active = false;
            wheelGame.countingDown = false;
            renderMainMenu();
        };
        
        if (gameId === 'mines') renderMinesGame();
        else if (gameId === 'wheel') renderWheelGame();
        else if (gameId === 'rocket') renderRocketGame();
    }
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMainMenu();
</script>
</body>
</html>
