<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Scrooge Case — Casino Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --gold: #ffd700;
            --gold-dark: #ccaa00;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            padding: 20px;
            min-height: 100vh;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.06"><text x="15" y="30" font-size="24" fill="%23ffd700">💎</text><text x="55" y="70" font-size="30" fill="%23ffcc00">🏆</text><text x="100" y="45" font-size="20" fill="%23ffd700">✨</text><text x="140" y="90" font-size="26" fill="%23ffcc00">💎</text><text x="25" y="120" font-size="22" fill="%23ffd700">🏆</text><text x="80" y="150" font-size="28" fill="%23ffcc00">✨</text><text x="130" y="170" font-size="20" fill="%23ffd700">💎</text><text x="165" y="130" font-size="24" fill="%23ffcc00">🏆</text><text x="45" y="180" font-size="18" fill="%23ffd700">✨</text><text x="110" y="195" font-size="22" fill="%23ffcc00">💎</text></svg>');
            background-repeat: repeat;
            background-size: 120px 120px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 10%, rgba(20, 15, 8, 0.6), rgba(5, 3, 2, 0.95));
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 15, 8, 0.8));
            backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 8px 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .balance {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance span {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .add-stars {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .add-stars:active {
            transform: scale(0.95);
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 600;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 16px;
        }

        .game-menu-card {
            position: relative;
            background: linear-gradient(145deg, rgba(25, 22, 18, 0.9), rgba(15, 12, 8, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .game-menu-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .game-menu-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .game-menu-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .game-menu-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .game-menu-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            border-radius: 60px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
        }

        .game-card {
            background: linear-gradient(145deg, rgba(20, 18, 14, 0.75), rgba(10, 8, 6, 0.85));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: rgba(255, 215, 0, 0.7);
            margin-bottom: 14px;
        }

        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .bet-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 170, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 16px;
            flex: 1 0 auto;
            text-align: center;
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .info-panel {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            border-radius: 32px;
            padding: 20px;
            margin: 24px 0;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .potential-win {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* Wheel of Fortune Styles */
        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .wheel-canvas-container {
            position: relative;
            display: inline-block;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transition: transform 0.3s ease;
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #ffd700;
            filter: drop-shadow(0 5px 10px rgba(0, 0, 0, 0.3));
            z-index: 10;
        }

        .wheel-pointer::after {
            content: "▼";
            position: absolute;
            top: -45px;
            left: -12px;
            font-size: 24px;
            color: #ffd700;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }

        .timer-display {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin: 20px 0;
        }

        .participants-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 12px;
            margin: 16px 0;
        }

        .participant {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            font-size: 14px;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 800;
            color: #1a1a1a;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cash {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .explosion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff6600, #990000);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: explosionFlash 0.6s ease-out forwards;
        }

        @keyframes explosionFlash {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            20% { opacity: 0.9; backdrop-filter: blur(10px); }
            100% { opacity: 0; backdrop-filter: blur(0px); }
        }

        .shake-screen {
            animation: shakeScreen 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeScreen {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(30, 25, 15, 0.95));
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 1000;
            transition: 0.25s;
            opacity: 0;
            pointer-events: none;
            font-weight: 600;
            border: 1px solid #ffd700;
            white-space: nowrap;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .bet-btn { padding: 8px 12px; font-size: 13px; }
            .game-menu-icon { font-size: 56px; }
            .game-menu-title { font-size: 24px; }
            .timer-display { font-size: 36px; }
            canvas { width: 280px; height: 280px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">💎 <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">💎 +500</button>
    </div>

    <div id="mainContent"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== БАЛАНС ==========
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`✨ +${amount} Stars`, false);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ Недостаточно Stars!', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🏆 +${amount} Stars!`, false);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.borderColor = isError ? '#e74c3c' : '#ffd700';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ========== ГЛОБАЛЬНЫЕ ФУНКЦИИ ==========
    function showExplosionEffect() {
        const overlay = document.createElement('div');
        overlay.className = 'explosion-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 600);
        document.body.classList.add('shake-screen');
        setTimeout(() => document.body.classList.remove('shake-screen'), 500);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        }
    }
    
    // ========== ИГРА: КОЛЕСО ФОРТУНЫ ==========
    let wheelGame = {
        active: false,
        countingDown: false,
        countdown: 10,
        bet: 10,
        participants: [],
        myBetPlaced: false,
        spinning: false,
        countdownInterval: null,
        canvas: null,
        ctx: null,
        animationId: null,
        currentAngle: 0,
        targetAngle: 0
    };
    
    // Цвета для сегментов
    const wheelColors = [
        '#ff3366', '#ff6633', '#ffcc33', '#33ff66', '#33ccff', '#9b59b6',
        '#e74c3c', '#3498db', '#1abc9c', '#f39c12', '#2ecc71', '#e67e22'
    ];
    
    function drawWheel() {
        if (!wheelGame.canvas || !wheelGame.ctx) return;
        const ctx = wheelGame.ctx;
        const canvas = wheelGame.canvas;
        const size = canvas.width;
        const center = size / 2;
        const radius = size / 2 - 5;
        
        ctx.clearRect(0, 0, size, size);
        
        if (wheelGame.participants.length === 0) {
            ctx.beginPath();
            ctx.arc(center, center, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#333';
            ctx.fill();
            ctx.fillStyle = '#ffd700';
            ctx.font = 'bold 16px Poppins';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('НЕТ СТАВОК', center, center);
            return;
        }
        
        const totalBet = wheelGame.participants.reduce((sum, p) => sum + p.bet, 0);
        let startAngle = wheelGame.currentAngle;
        
        for (let i = 0; i < wheelGame.participants.length; i++) {
            const p = wheelGame.participants[i];
            const angle = (p.bet / totalBet) * 2 * Math.PI;
            const endAngle = startAngle + angle;
            
            ctx.beginPath();
            ctx.arc(center, center, radius, startAngle, endAngle);
            ctx.lineTo(center, center);
            ctx.fillStyle = wheelColors[i % wheelColors.length];
            ctx.fill();
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(startAngle + angle / 2);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px Poppins';
            ctx.shadowBlur = 0;
            ctx.fillText(p.name.slice(0, 12), radius - 40, 5);
            ctx.restore();
            
            startAngle = endAngle;
        }
        
        // Рисуем центральный круг
        ctx.beginPath();
        ctx.arc(center, center, 25, 0, 2 * Math.PI);
        ctx.fillStyle = '#1a1a1a';
        ctx.fill();
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 20px Poppins';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎡', center, center);
        
        // Рисуем ободок
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.stroke();
    }
    
    function spinWheel() {
        if (wheelGame.spinning) return;
        const totalBet = wheelGame.participants.reduce((sum, p) => sum + p.bet, 0);
        if (totalBet === 0) return;
        
        wheelGame.spinning = true;
        
        // Случайный угол остановки для выбора победителя
        const randomValue = Math.random() * totalBet;
        let cumulative = 0;
        let winnerIndex = 0;
        for (let i = 0; i < wheelGame.participants.length; i++) {
            cumulative += wheelGame.participants[i].bet;
            if (randomValue <= cumulative) {
                winnerIndex = i;
                break;
            }
        }
        const winner = wheelGame.participants[winnerIndex];
        
        // Вычисляем угол, на котором должен остановиться сегмент победителя под стрелкой
        // Стрелка сверху (угол -90 градусов = -PI/2)
        const targetSegmentCenter = (2 * Math.PI * (randomValue / totalBet)) - (wheelGame.participants[winnerIndex].bet / totalBet * Math.PI);
        const targetAngle = (Math.PI / 2) - targetSegmentCenter;
        
        const spins = 360 * 5; // 5 полных оборотов
        const finalAngle = targetAngle + (spins * Math.PI / 180);
        
        wheelGame.targetAngle = finalAngle;
        
        let startTime = null;
        const duration = 3000;
        
        function animateSpin(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(1, elapsed / duration);
            const easeOut = 1 - Math.pow(1 - progress, 3);
            
            wheelGame.currentAngle = (wheelGame.currentAngle + (finalAngle - wheelGame.currentAngle) * easeOut) % (2 * Math.PI);
            drawWheel();
            
            if (progress < 1) {
                wheelGame.animationId = requestAnimationFrame(animateSpin);
            } else {
                wheelGame.currentAngle = finalAngle % (2 * Math.PI);
                drawWheel();
                wheelGame.spinning = false;
                
                addWin(totalBet);
                showToast(`🎡 ПОБЕДИТЕЛЬ: ${winner.name} (забрал ${totalBet} Stars)!`, false);
                
                wheelGame.active = false;
                wheelGame.countingDown = false;
                wheelGame.myBetPlaced = false;
                wheelGame.participants = [];
                renderWheelGame();
            }
        }
        
        if (wheelGame.animationId) cancelAnimationFrame(wheelGame.animationId);
        wheelGame.animationId = requestAnimationFrame(animateSpin);
    }
    
    function startWheelCountdown() {
        if (wheelGame.countdownInterval) clearInterval(wheelGame.countdownInterval);
        wheelGame.countingDown = true;
        wheelGame.countdown = 10;
        wheelGame.myBetPlaced = false;
        wheelGame.participants = [];
        wheelGame.spinning = false;
        wheelGame.currentAngle = 0;
        drawWheel();
        renderWheelGame();
        
        wheelGame.countdownInterval = setInterval(() => {
            wheelGame.countdown--;
            renderWheelGame();
            
            if (wheelGame.countdown <= 0) {
                clearInterval(wheelGame.countdownInterval);
                wheelGame.countingDown = false;
                if (wheelGame.participants.length === 0) {
                    showToast('Нет участников! Начните новый раунд', true);
                    renderWheelGame();
                } else {
                    spinWheel();
                }
            }
        }, 1000);
    }
    
    function placeWheelBet() {
        if (!wheelGame.countingDown) {
            showToast('Нет активного раунда! Нажмите "НОВЫЙ РАУНД"', true);
            return;
        }
        if (wheelGame.myBetPlaced) {
            showToast('Вы уже сделали ставку!', true);
            return;
        }
        if (wheelGame.bet < 10) {
            showToast('Минимальная ставка 10 Stars', true);
            return;
        }
        if (!deductStars(wheelGame.bet)) return;
        
        wheelGame.myBetPlaced = true;
        wheelGame.participants.push({ name: 'Вы', bet: wheelGame.bet });
        
        drawWheel();
        renderWheelGame();
        showToast(`✅ Ставка ${wheelGame.bet} Stars принята!`, false);
    }
    
    function raiseWheelBet() {
        if (!wheelGame.countingDown) {
            showToast('Нет активного раунда!', true);
            return;
        }
        if (!wheelGame.myBetPlaced) {
            showToast('Сначала сделайте ставку!', true);
            return;
        }
        const extra = 10;
        if (!deductStars(extra)) return;
        
        const myParticipant = wheelGame.participants.find(p => p.name === 'Вы');
        if (myParticipant) myParticipant.bet += extra;
        showToast(`Ставка повышена на +10 Stars!`, false);
        drawWheel();
        renderWheelGame();
    }
    
    function newWheelRound() {
        if (wheelGame.countingDown || wheelGame.spinning) {
            showToast('Дождитесь окончания текущего раунда!', true);
            return;
        }
        startWheelCountdown();
    }
    
    function renderWheelGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        const totalBet = wheelGame.participants.reduce((sum, p) => sum + p.bet, 0);
        let participantsHtml = '<div class="participants-list">';
        if (wheelGame.participants.length === 0) {
            participantsHtml += '<div style="text-align:center; padding:12px; opacity:0.5;">Ожидание ставок...</div>';
        } else {
            wheelGame.participants.forEach(p => {
                const chance = totalBet > 0 ? ((p.bet / totalBet) * 100).toFixed(1) : 0;

    function getBaseMultiplier(minesCount) {
        return {3: 3.5, 5: 6.5, 7: 11.0}[minesCount] || 3.5;
    }
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        minesGame.cellsRevealed = 0;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) { newBoard[r][c] = -1; minesPlaced++; }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`💎 Игра началась! Ставка ${minesGame.bet} Stars`, false);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active || minesGame.revealed[row][col]) return;

            showExplosionEffect();
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        const totalSafe = 25 - minesGame.minesCount;
        const progress = minesGame.cellsRevealed / totalSafe;
        minesGame.multiplier = +(1 + (minesGame.maxMultiplier - 1) * Math.pow(progress, 1.2)).toFixed(2);
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! ${win} Stars!`, false);
            renderMinesGame();
            return;
        }
        renderMinesGame();
    }

                <div class="game-menu-card" data-game="mines">
                    <div class="game-menu-icon">💎</div>
                    <div class="game-menu-title">MINES</div>
                    <div class="game-menu-desc">Классическое минное поле. Множитель до x11!</div>
                    <div class="game-menu-badge">🔥 ПОПУЛЯРНОЕ</div>
                </div>
                <div class="game-menu-card" data-game="wheel">
                    <div class="game-menu-icon">🎡</div>
                    <div class="game-menu-title">FORTUNE WHEEL</div>
                    <div class="game-menu-desc">Колесо фортуны. Сегменты по % ставок. Раунд 10 сек!</div>
                    <div class="game-menu-badge">🎡 АКТИВНА</div>
                </div>
                <div class="game-menu-card" data-game="rocket">
                    <div class="game-menu-icon">🚀</div>
                    <div class="game-menu-title">ROCKET</div>
                    <div class="game-menu-desc">Ракетка. Непредсказуемый взрыв, множитель до x30!</div>
                    <div class="game-menu-badge">🚀 АКТИВНА</div>
                </div>
            </div>
        `;
        
        document.querySelectorAll('.game-menu-card').forEach(card => {
            card.onclick = () => openGame(card.dataset.game);
        });
    }
    
    function openGame(gameId) {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `<button class="back-btn" id="backToMenuBtn">← ВЕРНУТЬСЯ В МЕНЮ</button><div id="gameContent"></div>`;
        document.getElementById('backToMenuBtn').onclick = () => {
            if (rocketGame.interval) clearInterval(rocketGame.interval);
            if (rocketGame.countdownInterval) clearInterval(rocketGame.countdownInterval);
            if (wheelGame.countdownInterval) clearInterval(wheelGame.countdownInterval);
            if (wheelGame.animationId) cancelAnimationFrame(wheelGame.animationId);
            rocketGame.active = false;
            rocketGame.countingDown = false;
            wheelGame.active = false;
            wheelGame.countingDown = false;
            renderMainMenu();
        };
        
        if (gameId === 'mines') renderMinesGame();
        else if (gameId === 'wheel') renderWheelGame();
        else if (gameId === 'rocket') renderRocketGame();
    }
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMainMenu();
</script>
</body>
</html>
