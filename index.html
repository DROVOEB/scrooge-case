<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scrooge Case — Минное поле</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at 20% 0%, #0a0a1a, #03030a);
            font-family: 'Segoe UI', 'Poppins', system-ui, 'Inter', sans-serif;
            color: white;
            padding: 20px 16px 80px;
            min-height: 100vh;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .balance {
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 16px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 18px;
        }

        .stars {
            color: #ffd966;
        }

        .add-stars {
            background: linear-gradient(135deg, #ffaa33, #ff7733);
            border: none;
            border-radius: 40px;
            padding: 6px 16px;
            font-weight: bold;
            color: #1a1a2a;
            cursor: pointer;
            transition: 0.1s;
        }

        .add-stars:active {
            transform: scale(0.96);
        }

        .game-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px;
            border-radius: 60px;
        }

        .game-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .game-tab.active {
            background: linear-gradient(135deg, #ffaa33, #ff7733);
            color: #1a1a2a;
            box-shadow: 0 0 12px rgba(255, 170, 51, 0.3);
        }

        .game-card {
            background: rgba(10, 10, 25, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 20px 0;
            aspect-ratio: 1;
        }

        .mine-cell {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            aspect-ratio: 1;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
        }

        .mine-cell.revealing {
            animation: popOpen 0.25s ease-out forwards;
        }

        @keyframes popOpen {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .mine-cell:active {
            transform: scale(0.92);
        }

        .mine-cell.revealed {
            cursor: default;
            transform: none;
        }

        .mine-cell.safe {
            background: linear-gradient(145deg, #2a6a4a, #1a4a3a);
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.4);
        }

        .mine-cell.mine-revealed {
            background: linear-gradient(145deg, #9b2c2c, #5a1010);
            animation: explode 0.4s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                background: #ff6600;
            }
            30% {
                transform: scale(1.3);
                background: #ff3300;
            }
            70% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                background: #5a1010;
            }
        }

        .mine-cell .hint-number {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 2px 6px;
        }

        .explosion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff6600, #990000);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: explosionFlash 0.5s ease-out forwards;
        }

        @keyframes explosionFlash {
            0% { opacity: 0; }
            20% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        .shake-field {
            animation: shakeField 0.4s ease-in-out;
        }

        @keyframes shakeField {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .btn {
            background: linear-gradient(95deg, #4a4aff, #2a2aff);
            border: none;
            padding: 12px 20px;
            border-radius: 44px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin: 4px;
            transition: 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-cash {
            background: linear-gradient(95deg, #2ecc71, #27ae60);
        }

        .btn-danger {
            background: linear-gradient(95deg, #e74c3c, #c0392b);
        }

        input, select {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 28px;
            color: white;
            margin: 8px;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 40px;
            z-index: 1000;
            transition: 0.2s;
            opacity: 0;
            pointer-events: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .multiplier-badge {
            background: linear-gradient(135deg, #ffaa33, #ff7733);
            color: #1a1a2a;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: bold;
            display: inline-block;
            margin: 8px 0;
        }

        button:disabled {
            opacity: 0.5;
            transform: none;
        }

        .info-text {
            font-size: 14px;
            opacity: 0.8;
            margin-top: 8px;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">⭐ <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">➕ 500 Stars</button>
    </div>

    <div class="game-nav">
        <div class="game-tab active" data-game="mines">💣 Минное поле</div>
        <div class="game-tab" data-game="wheel">🎡 Колесо фортуны</div>
        <div class="game-tab" data-game="rocket">🚀 Ракетка</div>
    </div>

    <div id="gameContainer"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ==================== БАЛАНС ====================
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`+${amount} Stars`);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ Недостаточно Stars!', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🎉 Выигрыш ${amount} Stars!`);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.background = isError ? '#aa2e2ecc' : '#1f3f2ecc';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ==================== ИГРА: МИННОЕ ПОЛЕ ====================
    let minesGame = {
        active: false,
        board: [],
        revealed: [],
        minesCount: 3,
        bet: 20,
        multiplier: 1,
        safeLeft: 0,
        currentBet: 0,
        cellsRevealed: 0,
        maxMultiplier: 0
    };
    
    // Базовый множитель в зависимости от количества мин (чем больше мин, тем выше потенциал)
    function getBaseMultiplier(minesCount) {
        const multipliers = {
            3: 2.5,   // 3 мины → макс x2.5
            5: 4.0,   // 5 мин → макс x4.0
            7: 6.5    // 7 мин → макс x6.5
        };
        return multipliers[minesCount] || 3.0;
    }
    
    // Расчёт текущего множителя на основе открытых безопасных клеток
    function calculateMultiplier(minesCount, openedSafe, totalSafe) {
        const baseMax = getBaseMultiplier(minesCount);
        const progress = openedSafe / totalSafe;
        // Множитель растёт от 1 до baseMax
        return 1 + (baseMax - 1) * progress;
    }
    
    function showExplosionEffect() {
        const overlay = document.createElement('div');
        overlay.className = 'explosion-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 600);
        
        const grid = document.querySelector('.mines-grid');
        if (grid) {
            grid.classList.add('shake-field');
            setTimeout(() => grid.classList.remove('shake-field'), 500);
        }
        
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        }
    }
    
    function initMinesGame() {
        const betInput = document.getElementById('minesBet');
        const minesSelect = document.getElementById('minesCount');
        const bet = betInput ? parseInt(betInput.value) : minesGame.bet;
        const mines = minesSelect ? parseInt(minesSelect.value) : minesGame.minesCount;
        
        if (bet < 20) {
            showToast('Минимальная ставка 20 Stars', true);
            return;
        }
        
        if (!deductStars(bet)) return;
        
        minesGame.active = true;
        minesGame.currentBet = bet;
        minesGame.multiplier = 1;
        minesGame.minesCount = mines;
        minesGame.cellsRevealed = 0;
        
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) {
                newBoard[r][c] = -1;
                minesPlaced++;
            }
        }
        
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i + di, nj = j + dj;
                            if (ni >= 0 && ni < size && nj >= 0 && nj < size && newBoard[ni][nj] === -1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size * size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`🎲 Игра началась! Ставка ${bet} Stars, ${totalMines} мин | Макс. множитель: x${minesGame.maxMultiplier}`);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active) return;
        if (minesGame.revealed[row][col]) return;
        
        const cellDiv = document.querySelector(`.mine-cell[data-row='${row}'][data-col='${col}']`);
        
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            
            if (cellDiv) {
                cellDiv.classList.add('mine-revealed');
                cellDiv.classList.add('revealing');
                setTimeout(() => {
                    cellDiv.innerHTML = '💣';
                    cellDiv.classList.add('revealed');
                }, 150);
            }
            
            showExplosionEffect();
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        
        // Безопасная клетка
        if (cellDiv) {
            cellDiv.classList.add('revealing');
            setTimeout(() => {
                cellDiv.classList.add('safe');
                cellDiv.classList.add('revealed');
                cellDiv.innerHTML = '💎';
                
                const val = minesGame.board[row][col];
                if (val > 0) {
                    const hintSpan = document.createElement('span');
                    hintSpan.className = 'hint-number';
                    hintSpan.textContent = val;
                    cellDiv.appendChild(hintSpan);
                }
            }, 100);
        }
        
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        
        const totalSafe = 25 - minesGame.minesCount;
        const openedSafe = minesGame.cellsRevealed;
        minesGame.multiplier = calculateMultiplier(minesGame.minesCount, openedSafe, totalSafe);
        minesGame.multiplier = parseFloat(minesGame.multiplier.toFixed(2));
        
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! Выигрыш ${win} Stars (x${minesGame.multiplier})!`);
            renderMinesGame();
            return;
        }
        
        renderMinesGameStats();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 Вы забрали ${win} Stars (x${minesGame.multiplier})!`);
        renderMinesGame();
    }
    
    function renderMinesGameStats() {
        const statsDiv = document.getElementById('minesStats');
        if (statsDiv) {
            const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
            const remaining = minesGame.safeLeft;
            const totalSafe = 25 - minesGame.minesCount;
            const opened = totalSafe - remaining;
            const progress = Math.floor((opened / totalSafe) * 100);
            
            statsDiv.innerHTML = `
                <div style="margin: 16px 0;">
                    <span class="multiplier-badge">🎯 Текущий множитель: x${minesGame.multiplier}</span>
                    <span class="multiplier-badge" style="background: #2ecc71;">💰 Макс. x${minesGame.maxMultiplier}</span>
                </div>
                <div class="btn-group">
                    <button class="btn btn-cash" onclick="cashoutMines()">💰 ЗАБРАТЬ (${potentialWin} ⭐)</button>
                </div>
                <div style="margin-top: 12px;">
                    <div>📊 Прогресс: ${progress}% (${opened}/${totalSafe} безопасных)</div>
                    <div>💎 Осталось безопасных: ${remaining}</div>
                    <div class="info-text">⚠️ Чем больше мин, тем выше множитель!</div>
                </div>
            `;
        }
    }
    
    function renderMinesGame() {
        const container = document.getElementById('gameContainer');
        
        if (!minesGame.active || minesGame.board.length === 0) {
            // Начальный экран с настройками и подсказкой
            const maxMultiplierPreview = getBaseMultiplier(minesGame.minesCount);
            container.innerHTML = `
                <div class="game-card">
                    <h3>💎 Минное поле 5x5</h3>
                    <div>⭐ Баланс: ${balance}</div>
                    <div style="margin: 16px 0;">
                        <label>💰 Ставка: </label>
                        <input type="number" id="minesBet" min="20" value="${minesGame.bet}">
                        <label>💣 Мин: </label>
                        <select id="minesCount">
                            <option value="3" ${minesGame.minesCount === 3 ? 'selected' : ''}>3 мины (макс x2.5)</option>
                            <option value="5" ${minesGame.minesCount === 5 ? 'selected' : ''}>5 мин (макс x4.0)</option>
                            <option value="7" ${minesGame.minesCount === 7 ? 'selected' : ''}>7 мин (макс x6.5)</option>
                        </select>
                    </div>
                    <div class="info-text">💡 Подсказка: чем больше мин, тем выше потенциальный множитель!</div>
                    <div class="info-text">⭐ Текущий макс. множитель: x${maxMultiplierPreview}</div>
                    <button class="btn" id="startMinesBtn" style="margin-top: 16px;">🚀 Новая игра</button>
                </div>
            `;
            
            const betInput = document.getElementById('minesBet');
            const minesSelect = document.getElementById('minesCount');
            const previewDiv = container.querySelector('.info-text:last-of-type');
            
            const updatePreview = () => {
                const mines = parseInt(minesSelect.value);
                const maxMult = getBaseMultiplier(mines);
                if (previewDiv) previewDiv.innerHTML = `⭐ Текущий макс. множитель: x${maxMult}`;
            };
            
            if (betInput) betInput.addEventListener('change', (e) => minesGame.bet = Math.max(20, parseInt(e.target.value) || 20));
            if (minesSelect) {
                minesSelect.addEventListener('change', (e) => {
                    minesGame.minesCount = parseInt(e.target.value);
                    updatePreview();
                });
            }
            
            document.getElementById('startMinesBtn')?.addEventListener('click', initMinesGame);
            updatePreview();
            return;
        }
        
        // Активная игра
        let gridHtml = '<div class="mines-grid">';
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const isRevealed = minesGame.revealed[i][j];
                let content = '🪙';
                let additionalClass = '';
                
                if (isRevealed) {
                    if (minesGame.board[i][j] === -1) {
                        content = '💣';
                        additionalClass = 'mine-revealed revealed';
                    } else {
                        content = '💎';
                        additionalClass = 'safe revealed';
                    }
                }
                
                // Добавляем подсказку с цифрой для уже открытых
                let hintHtml = '';
                if (isRevealed && minesGame.board[i][j] > 0 && minesGame.board[i][j] !== -1) {
                    hintHtml = `<span class="hint-number">${minesGame.board[i][j]}</span>`;
                }
                
                gridHtml += `<div class="mine-cell ${additionalClass}" data-row="${i}" data-col="${j}" onclick="revealMineCell(${i},${j})">${content}${hintHtml}</div>`;
            }
        }
        gridHtml += '</div>';
        
        const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
        const totalSafe = 25 - minesGame.minesCount;
        const opened = totalSafe - minesGame.safeLeft;
        const progress = Math.floor((opened / totalSafe) * 100);
        
        container.innerHTML = `
            <div class="game-card">
                <h3>💎 Минное поле 5x5 | ${minesGame.minesCount} мин</h3>
                ${gridHtml}
                <div id="minesStats">
                    <div style="margin: 16px 0;">
                        <span class="multiplier-badge">🎯 x${minesGame.multiplier}</span>
                        <span class="multiplier-badge" style="background: #2ecc71;">🏆 макс x${minesGame.maxMultiplier}</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-cash" onclick="cashoutMines()">💰 ЗАБРАТЬ (${potentialWin} ⭐)</button>
                    </div>
                    <div style="margin-top: 12px;">
                        <div>📊 Прогресс: ${progress}% (${opened}/${totalSafe})</div>
                        <div>💎 Осталось безопасных: ${minesGame.safeLeft}</div>
                    </div>
                </div>
            </div>
        `;
    }
    
    // ==================== ЗАГЛУШКИ ДЛЯ ДРУГИХ ИГР ====================
    function renderWheelGame() {
        const container = document.getElementById('gameContainer');
        container.innerHTML = `<div class="game-card"><h3>🎡 Колесо фортуны</h3><div style="text-align:center; padding:40px;">🚧 В разработке 🚧</div><div>⭐ Баланс: ${balance}</div></div>`;
    }
    
    function renderRocketGame() {
        const container = document.getElementById('gameContainer');
        container.innerHTML = `<div class="game-card"><h3>🚀 Ракетка</h3><div style="text-align:center; padding:40px;">🚧 В разработке 🚧</div><div>⭐ Баланс: ${balance}</div></div>`;
    }
    
    // ==================== НАВИГАЦИЯ ====================
    let currentGame = 'mines';
    function switchGame(game) {
        currentGame = game;
        document.querySelectorAll('.game-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.game === game);
        });
        if (game === 'mines') renderMinesGame();
        else if (game === 'wheel') renderWheelGame();
        else if (game === 'rocket') renderRocketGame();
    }
    
    document.querySelectorAll('.game-tab').forEach(tab => {
        tab.onclick = () => switchGame(tab.dataset.game);
    });
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMinesGame();
</script>
</body>
</html>
