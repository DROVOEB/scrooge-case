<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scrooge Case — Минное поле</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
            color: white;
            padding: 20px 16px 80px;
            min-height: 100vh;
            position: relative;
            background: #0a2a1a;
        }

        /* Долларовый фон */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.12"><text x="10" y="20" font-size="14" fill="%23aaff88">💵</text><text x="40" y="45" font-size="18" fill="%2388ff66">💰</text><text x="70" y="30" font-size="12" fill="%23ccff99">💵</text><text x="20" y="70" font-size="16" fill="%2399ff77">💰</text><text x="60" y="80" font-size="14" fill="%23aaff88">💵</text><text x="85" y="60" font-size="20" fill="%2377ff55">💰</text><text x="5" y="90" font-size="10" fill="%23bbff99">💵</text><text x="50" y="15" font-size="11" fill="%2388ff66">💰</text><text x="30" y="55" font-size="13" fill="%23ccff99">💵</text><text x="75" y="95" font-size="15" fill="%2399ff77">💰</text></svg>');
            background-repeat: repeat;
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 0%, rgba(10, 42, 26, 0.88), rgba(3, 20, 10, 0.96));
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 8px 18px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            backdrop-filter: blur(4px);
        }

        .balance span {
            color: #ffd700;
        }

        .add-stars {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            font-weight: bold;
            color: #1a4a2a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }

        .add-stars:active {
            transform: scale(0.95);
        }

        /* Навигация */
        .game-nav {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            padding: 8px;
            border-radius: 60px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .game-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .game-tab.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a4a2a;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }

        /* Карточка */
        .game-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 215, 0, 0.25);
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .game-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Секция ставок - кнопки пресеты */
        .bet-section {
            margin-bottom: 24px;
        }

        .section-label {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }

        .bet-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 16px;
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a4a2a;
            border-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        /* Выбор мин - карточки */
        .mines-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .mine-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 24px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mine-card.active {
            background: linear-gradient(135deg, #ffd70020, #ffaa0020);
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .mine-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .mine-count {
            font-size: 18px;
            font-weight: bold;
        }

        .mine-max {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
        }

        /* Инфо панель */
        .info-panel {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 28px;
            padding: 16px;
            margin: 20px 0;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .multiplier-preview {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
            text-align: center;
            margin: 12px 0;
        }

        .potential-win {
            background: rgba(255, 215, 0, 0.15);
            border-radius: 60px;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        /* Поле игры */
        .mines-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 24px 0;
            aspect-ratio: 1;
        }

        .mine-cell {
            background: linear-gradient(145deg, rgba(42, 74, 42, 0.9), rgba(26, 54, 26, 0.9));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            aspect-ratio: 1;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .mine-cell.revealing {
            animation: popOpen 0.25s ease-out forwards;
        }

        @keyframes popOpen {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .mine-cell:active { transform: scale(0.92); }
        .mine-cell.revealed { cursor: default; }
        .mine-cell.safe {
            background: linear-gradient(145deg, #2a7a4a, #1a5a3a);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
        }
        .mine-cell.mine-revealed {
            background: linear-gradient(145deg, #9b2c2c, #5a1010);
            animation: explode 0.4s ease-out forwards;
        }

        @keyframes explode {
            0% { transform: scale(1); background: #ff6600; }
            30% { transform: scale(1.3); background: #ff3300; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); background: #5a1010; }
        }

        .mine-cell .hint-number {
            position: absolute;
            bottom: 4px;
            right: 8px;
            font-size: 11px;
            color: #ffd700;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            padding: 2px 6px;
        }

        /* Кнопки */
        .btn {
            background: linear-gradient(95deg, #ffd700, #ffaa00);
            border: none;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: bold;
            color: #1a4a2a;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: all 0.1s;
        }

        .btn:active { transform: scale(0.97); }
        .btn-cash { background: linear-gradient(95deg, #2ecc71, #27ae60); color: white; }
        .btn:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }

        /* Взрыв */
        .explosion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff6600, #990000);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: explosionFlash 0.5s ease-out forwards;
        }

        @keyframes explosionFlash {
            0% { opacity: 0; }
            20% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        .shake-field {
            animation: shakeField 0.4s ease-in-out;
        }

        @keyframes shakeField {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 1000;
            transition: 0.2s;
            opacity: 0;
            pointer-events: none;
            font-weight: bold;
            border: 1px solid #ffd700;
            white-space: nowrap;
        }

        .multiplier-badge {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a4a2a;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">💰 <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">+500 Stars</button>
    </div>

    <div class="game-nav">
        <div class="game-tab active" data-game="mines">💣 Минное поле</div>
        <div class="game-tab" data-game="wheel">🎡 Колесо фортуны</div>
        <div class="game-tab" data-game="rocket">🚀 Ракетка</div>
    </div>

    <div id="gameContainer"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== БАЛАНС ==========
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`+${amount} Stars`);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ Недостаточно Stars!', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🎉 Выигрыш ${amount} Stars!`);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.background = isError ? '#aa2e2ecc' : '#1a4a2acc';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ========== ИГРА ==========
    let minesGame = {
        active: false, board: [], revealed: [], minesCount: 3, bet: 20,
        multiplier: 1, safeLeft: 0, currentBet: 0, cellsRevealed: 0, maxMultiplier: 0
    };
    
    function getBaseMultiplier(minesCount) {
        return {3: 2.5, 5: 4.0, 7: 6.5}[minesCount] || 3.0;
    }
    
    function calculateMultiplier(minesCount, openedSafe, totalSafe) {
        const baseMax = getBaseMultiplier(minesCount);
        return 1 + (baseMax - 1) * (openedSafe / totalSafe);
    }
    
    function showExplosionEffect() {
        const overlay = document.createElement('div');
        overlay.className = 'explosion-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 600);
        const grid = document.querySelector('.mines-grid');
        if (grid) { grid.classList.add('shake-field'); setTimeout(() => grid.classList.remove('shake-field'), 500); }
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        }
    }
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        minesGame.cellsRevealed = 0;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) { newBoard[r][c] = -1; minesPlaced++; }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`🎲 Игра началась! Ставка ${minesGame.bet} Stars, ${totalMines} мин | Макс. x${minesGame.maxMultiplier}`);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active || minesGame.revealed[row][col]) return;
        const cellDiv = document.querySelector(`.mine-cell[data-row='${row}'][data-col='${col}']`);
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            if (cellDiv) {
                cellDiv.classList.add('mine-revealed', 'revealing');
                setTimeout(() => { cellDiv.innerHTML = '💣'; cellDiv.classList.add('revealed'); }, 150);
            }
            showExplosionEffect();
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        if (cellDiv) {
            cellDiv.classList.add('revealing');
            setTimeout(() => {
                cellDiv.classList.add('safe', 'revealed');
                cellDiv.innerHTML = '💎';
                const val = minesGame.board[row][col];
                if (val > 0) {
                    const hintSpan = document.createElement('span');
                    hintSpan.className = 'hint-number';
                    hintSpan.textContent = val;
                    cellDiv.appendChild(hintSpan);
                }
            }, 100);
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        const totalSafe = 25 - minesGame.minesCount;
        minesGame.multiplier = parseFloat(calculateMultiplier(minesGame.minesCount, minesGame.cellsRevealed, totalSafe).toFixed(2));
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! Выигрыш ${win} Stars (x${minesGame.multiplier})!`);
            renderMinesGame();
            return;
        }
        renderMinesGameStats();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 Забрано ${win} Stars (x${minesGame.multiplier})!`);
        renderMinesGame();
    }
    
    function updatePreview() {
        const previewMult = getBaseMultiplier(minesGame.minesCount);
        const potential = Math.floor(minesGame.bet * previewMult);
        const multEl = document.getElementById('previewMultiplier');
        const potEl = document.getElementById('previewPotential');
        if (multEl) multEl.textContent = previewMult;
        if (potEl) potEl.textContent = potential;
    }
    
    function renderMinesGameStats() {
        const statsDiv = document.getElementById('minesStats');
        if (!statsDiv) return;
        const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
        const totalSafe = 25 - minesGame.minesCount;
        const progress = Math.floor((minesGame.cellsRevealed / totalSafe) * 100);
        statsDiv.innerHTML = `
            <div class="info-panel">
                <div class="info-row"><span>📊 Прогресс</span><span>${progress}%</span></div>
                <div class="info-row"><span>💎 Безопасных осталось</span><span>${minesGame.safeLeft}</span></div>
                <div class="multiplier-preview">x${minesGame.multiplier}</div>
                <div class="potential-win">💰 ЗАБРАТЬ МОЖНО: ${potentialWin} ⭐</div>
            </div>
            <button class="btn btn-cash" onclick="cashoutMines()">💰 ЗАБРАТЬ ВЫИГРЫШ</button>
        `;
    }
    
    function renderMinesGame() {
        const container = document.getElementById('gameContainer');
        if (!minesGame.active || !minesGame.board.length) {
            updatePreview();
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">💎 Минное поле 5x5</div>
                    <div class="bet-section">
                        <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                        <div class="bet-buttons">
                            <button class="bet-btn ${minesGame.bet === 20 ? 'active' : ''}" data-bet="20">20 ⭐</button>
                            <button class="bet-btn ${minesGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                            <button class="bet-btn ${minesGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                            <button class="bet-btn ${minesGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                            <button class="bet-btn ${minesGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        </div>
                    </div>
                    <div class="bet-section">
                        <div class="section-label">💣 КОЛИЧЕСТВО МИН</div>
                        <div class="mines-buttons">
                            <div class="mine-card ${minesGame.minesCount === 3 ? 'active' : ''}" data-mines="3">
                                <div class="mine-icon">💣💣💣</div>
                                <div class="mine-count">3 мины</div>
                                <div class="mine-max">макс x2.5</div>
                            </div>
                            <div class="mine-card ${minesGame.minesCount === 5 ? 'active' : ''}" data-mines="5">
                                <div class="mine-icon">💣💣💣💣💣</div>
                                <div class="mine-count">5 мин</div>
                                <div class="mine-max">макс x4.0</div>
                            </div>
                            <div class="mine-card ${minesGame.minesCount === 7 ? 'active' : ''}" data-mines="7">
                                <div class="mine-icon">💣💣💣💣💣💣💣</div>
                                <div class="mine-count">7 мин</div>
                                <div class="mine-max">макс x6.5</div>
                            </div>
                        </div>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>⭐ Ваша ставка</span><span>${minesGame.bet} Stars</span></div>
                        <div class="info-row"><span>💣 Макс. множитель</span><span>x<span id="previewMultiplier">${getBaseMultiplier(minesGame.minesCount)}</span></span></div>
                        <div class="potential-win">🏆 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: <span id="previewPotential">${Math.floor(minesGame.bet * getBaseMultiplier(minesGame.minesCount))}</span> ⭐</div>
                    </div>
                    <button class="btn" id="startGameBtn">🚀 НАЧАТЬ ИГРУ</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { minesGame.bet = parseInt(btn.dataset.bet); renderMinesGame(); };
            });
            document.querySelectorAll('.mine-card').forEach(card => {
                card.onclick = () => { minesGame.minesCount = parseInt(card.dataset.mines); renderMinesGame(); };
            });
            document.getElementById('startGameBtn').onclick = initMinesGame;
            return;
        }
        let gridHtml = '<div class="mines-grid">';
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const isRevealed = minesGame.revealed[i][j];
                let content = '🪙', addClass = '';
                if (isRevealed) {
                    if (minesGame.board[i][j] === -1) { content = '💣'; addClass = 'mine-revealed revealed'; }
                    else { content = '💎'; addClass = 'safe revealed'; }
                }
                let hint = '';
                if (isRevealed && minesGame.board[i][j] > 0 && minesGame.board[i][j] !== -1) {
                    hint = `<span class="hint-number">${minesGame.board[i][j]}</span>`;
                }
                gridHtml += `<div class="mine-cell ${addClass}" data-row="${i}" data-col="${j}" onclick="revealMineCell(${i},${j})">${content}${hint}</div>`;
            }
        }
        gridHtml += '</div>';
        container.innerHTML = `<div class="game-card"><div class="game-title">💎 Минное поле | ${minesGame.minesCount} мин</div>${gridHtml}<div id="minesStats"></div></div>`;
        renderMinesGameStats();
    }
    
    function renderWheelGame() {
        document.getElementById('gameContainer').innerHTML = `<div class="game-card"><div class="game-title">🎡 Колесо фортуны</div><div style="text-align:center; padding:40px;">🚧 В разработке 🚧</div></div>`;
    }
    
    function renderRocketGame() {
        document.getElementById('gameContainer').innerHTML = `<div class="game-card"><div class="game-title">🚀 Ракетка</div><div style="text-align:center; padding:40px;">🚧 В разработке 🚧</div></div>`;
    }
    
    let currentGame = 'mines';
    function switchGame(game) {
        currentGame = game;
        document.querySelectorAll('.game-tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.game === game);
        });
        if (game === 'mines') renderMinesGame();
        else if (game === 'wheel') renderWheelGame();
        else renderRocketGame();
    }
    
    document.querySelectorAll('.game-tab').forEach(tab => {
        tab.onclick = () => switchGame(tab.dataset.game);
    });
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMinesGame();
</script>
</body>
</html>
