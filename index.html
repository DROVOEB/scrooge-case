<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Scrooge Case — Rocket & Mines</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap');

        :root {
            --gold: #ffd700;
            --gold-dark: #ccaa00;
            --gold-glow: rgba(255, 215, 0, 0.4);
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: white;
            padding: 20px;
            min-height: 100vh;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.06"><text x="15" y="30" font-size="24" fill="%23ffd700">💎</text><text x="55" y="70" font-size="30" fill="%23ffcc00">🏆</text><text x="100" y="45" font-size="20" fill="%23ffd700">✨</text><text x="140" y="90" font-size="26" fill="%23ffcc00">💎</text><text x="25" y="120" font-size="22" fill="%23ffd700">🏆</text><text x="80" y="150" font-size="28" fill="%23ffcc00">✨</text><text x="130" y="170" font-size="20" fill="%23ffd700">💎</text><text x="165" y="130" font-size="24" fill="%23ffcc00">🏆</text><text x="45" y="180" font-size="18" fill="%23ffd700">✨</text><text x="110" y="195" font-size="22" fill="%23ffcc00">💎</text></svg>');
            background-repeat: repeat;
            background-size: 120px 120px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 10%, rgba(20, 15, 8, 0.6), rgba(5, 3, 2, 0.95));
            pointer-events: none;
            z-index: 0;
        }

        .app {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 15, 8, 0.8));
            backdrop-filter: blur(20px);
            border-radius: 80px;
            padding: 8px 20px;
            margin-bottom: 32px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .balance {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .balance span {
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        .add-stars {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 700;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .add-stars:active {
            transform: scale(0.95);
        }

        .back-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 600;
            color: #ffd700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 16px;
        }

        .game-menu-card {
            position: relative;
            background: linear-gradient(145deg, rgba(25, 22, 18, 0.9), rgba(15, 12, 8, 0.95));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .game-menu-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 215, 0, 0.6);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 215, 0, 0.3);
        }

        .game-menu-icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: inline-block;
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .game-menu-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ffaa00, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }

        .game-menu-desc {
            font-size: 13px;
            opacity: 0.7;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .game-menu-badge {
            display: inline-block;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 170, 0, 0.1));
            border-radius: 60px;
            padding: 8px 20px;
            font-size: 12px;
            font-weight: 700;
            color: #ffd700;
        }

        .game-card {
            background: linear-gradient(145deg, rgba(20, 18, 14, 0.75), rgba(10, 8, 6, 0.85));
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 24px;
        }

        .game-title {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .section-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            color: rgba(255, 215, 0, 0.7);
            margin-bottom: 14px;
        }

        .bet-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }

        .bet-btn {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 170, 0, 0.05));
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 12px 20px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            font-size: 16px;
            flex: 1 0 auto;
            text-align: center;
        }

        .bet-btn.active {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            color: #1a1a1a;
            border-color: transparent;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        .info-panel {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.3));
            border-radius: 32px;
            padding: 20px;
            margin: 24px 0;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            font-weight: 500;
        }

        .potential-win {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 170, 0, 0.08));
            border-radius: 60px;
            padding: 14px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* Rocket Game Styles */
        .rocket-track {
            background: linear-gradient(180deg, #1a1a2a, #0a0a1a);
            border-radius: 60px;
            padding: 20px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            min-height: 120px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .rocket-flight-area {
            position: relative;
            height: 80px;
            width: 100%;
            background: repeating-linear-gradient(90deg, rgba(255,215,0,0.1) 0px, rgba(255,215,0,0.1) 20px, transparent 20px, transparent 40px);
            border-radius: 40px;
            overflow: hidden;
        }

        .rocket-ship-horizontal {
            position: absolute;
            left: 0%;
            font-size: 48px;
            transition: left 0.05s linear;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
            z-index: 10;
        }

        .rocket-ship-horizontal.flying {
            animation: rocketShake 0.1s infinite;
        }

        @keyframes rocketShake {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        .rocket-ship-horizontal.exploding {
            animation: rocketHorizontalExplode 0.5s ease-out forwards;
        }

        @keyframes rocketHorizontalExplode {
            0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 5px #ff6600); }
            30% { transform: scale(1.5); opacity: 1; filter: drop-shadow(0 0 20px #ff3300); }
            100% { transform: scale(0.3); opacity: 0; filter: drop-shadow(0 0 0 #ff0000); left: 100%; }
        }

        .rocket-flame {
            position: absolute;
            right: -30px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 20px;
            background: linear-gradient(90deg, #ff6600, #ffaa00);
            border-radius: 0 10px 10px 0;
            animation: flameFlicker 0.05s infinite;
        }

        @keyframes flameFlicker {
            0%, 100% { width: 30px; opacity: 0.8; }
            50% { width: 40px; opacity: 1; }
        }

        .finish-line {
            position: absolute;
            right: 10px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #ffd700, #ffaa00);
            box-shadow: 0 0 10px #ffd700;
        }

        .coefficient-display {
            font-size: 56px;
            font-weight: 800;
            text-align: center;
            margin: 20px 0;
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .timer-display {
            font-size: 48px;
            font-weight: 800;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin: 20px 0;
        }

        .participants-list {
            max-height: 150px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 12px;
            margin: 16px 0;
        }

        .participant {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            font-size: 14px;
        }

        .past-coefficients {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0;
            justify-content: center;
        }

        .past-coeff {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            color: #ffd700;
        }

        .btn {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            padding: 16px 28px;
            border-radius: 60px;
            font-weight: 800;
            color: #1a1a1a;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-cash {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .explosion-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ff6600, #990000);
            opacity: 0;
            pointer-events: none;
            z-index: 999;
            animation: explosionFlash 0.6s ease-out forwards;
        }

        @keyframes explosionFlash {
            0% { opacity: 0; backdrop-filter: blur(0px); }
            20% { opacity: 0.9; backdrop-filter: blur(10px); }
            100% { opacity: 0; backdrop-filter: blur(0px); }
        }

        .shake-screen {
            animation: shakeScreen 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        @keyframes shakeScreen {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(30, 25, 15, 0.95));
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 60px;
            z-index: 1000;
            transition: 0.25s;
            opacity: 0;
            pointer-events: none;
            font-weight: 600;
            border: 1px solid #ffd700;
            white-space: nowrap;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .bet-btn { padding: 8px 12px; font-size: 13px; }
            .game-menu-icon { font-size: 56px; }
            .game-menu-title { font-size: 24px; }
            .coefficient-display { font-size: 40px; }
            .rocket-ship-horizontal { font-size: 36px; }
            .timer-display { font-size: 36px; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="balance">💎 <span id="balance">1000</span> Stars</div>
        <button class="add-stars" id="addStarsBtn">💎 +500</button>
    </div>

    <div id="mainContent"></div>
</div>
<div id="toast" class="toast"></div>

<script>
    // ========== БАЛАНС ==========
    let balance = parseInt(localStorage.getItem('balance') || '1000');
    const balanceEl = document.getElementById('balance');
    
    function updateBalanceUI() {
        balanceEl.textContent = balance;
        localStorage.setItem('balance', balance);
    }
    
    function addStars(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`✨ +${amount} Stars`, false);
    }
    
    function deductStars(amount) {
        if (balance >= amount) {
            balance -= amount;
            updateBalanceUI();
            return true;
        }
        showToast('❌ Недостаточно Stars!', true);
        return false;
    }
    
    function addWin(amount) {
        balance += amount;
        updateBalanceUI();
        showToast(`🏆 +${amount} Stars!`, false);
    }
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.opacity = '1';
        toast.style.borderColor = isError ? '#e74c3c' : '#ffd700';
        setTimeout(() => toast.style.opacity = '0', 2000);
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred(isError ? 'heavy' : 'light');
        }
    }
    
    document.getElementById('addStarsBtn').onclick = () => addStars(500);
    
    // ========== ИСТОРИЯ КОЭФФИЦИЕНТОВ ==========
    let pastCoefficients = [1.08, 1.24, 3.52, 1.17, 2.88, 1.45, 5.21, 1.09, 11.32, 1.76];
    
    // ========== ИГРА: РАКЕТКА ==========
    let rocketGame = {
        active: false,
        countingDown: false,
        countdown: 10,
        bet: 50,
        currentBet: 0,
        multiplier: 1.00,
        targetMultiplier: 1.00,
        interval: null,
        countdownInterval: null,
        cashedOut: false,
        participants: [],
        myBetPlaced: false
    };
    
    function addPastCoefficient(coeff) {
        pastCoefficients.unshift(coeff);
        if (pastCoefficients.length > 15) pastCoefficients.pop();
    }
    
    function showExplosionEffect() {
        const overlay = document.createElement('div');
        overlay.className = 'explosion-overlay';
        document.body.appendChild(overlay);
        setTimeout(() => overlay.remove(), 600);
        
        document.body.classList.add('shake-screen');
        setTimeout(() => document.body.classList.remove('shake-screen'), 500);
        
        if (window.Telegram?.WebApp?.HapticFeedback) {
            window.Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
        }
    }
    
    function startCountdown() {
        if (rocketGame.countdownInterval) clearInterval(rocketGame.countdownInterval);
        rocketGame.countingDown = true;
        rocketGame.countdown = 10;
        rocketGame.myBetPlaced = false;
        rocketGame.participants = [];
        
        renderRocketGame();
        
        rocketGame.countdownInterval = setInterval(() => {
            rocketGame.countdown--;
            renderRocketGame();
            
            if (rocketGame.countdown <= 0) {
                clearInterval(rocketGame.countdownInterval);
                rocketGame.countingDown = false;
                
                if (rocketGame.participants.length === 0) {
                    showToast('Нет участников! Начните новый раунд', true);
                    renderRocketGame();
                } else {
                    startFlight();
                }
            }
        }, 1000);
    }
    
    function placeRocketBet() {
        if (!rocketGame.countingDown) {
            showToast('Нет активного раунда! Нажмите "НОВЫЙ РАУНД"', true);
            return;
        }
        if (rocketGame.myBetPlaced) {
            showToast('Вы уже сделали ставку!', true);
            return;
        }
        if (rocketGame.bet < 50) {
            showToast('Минимальная ставка 50 Stars', true);
            return;
        }
        if (!deductStars(rocketGame.bet)) return;
        
        rocketGame.myBetPlaced = true;
        rocketGame.currentBet = rocketGame.bet;
        rocketGame.participants.push({ name: 'Вы', bet: rocketGame.bet, cashedOut: false });
        
        renderRocketGame();
        showToast(`✅ Ставка ${rocketGame.bet} Stars принята!`, false);
    }
    
    function startFlight() {
        rocketGame.active = true;
        rocketGame.multiplier = 1.00;
        rocketGame.cashedOut = false;
        rocketGame.targetMultiplier = +(Math.random() * (25 - 1.5) + 1.5).toFixed(2);
        
        const rocket = document.querySelector('.rocket-ship-horizontal');
        if (rocket) {
            rocket.classList.add('flying');
        }
        
        if (rocketGame.interval) clearInterval(rocketGame.interval);
        rocketGame.interval = setInterval(() => {
            if (!rocketGame.active) return;
            
            const increment = 0.02 + (rocketGame.multiplier / 250);
            rocketGame.multiplier = +(rocketGame.multiplier + increment).toFixed(2);
            
            const progress = Math.min(95, (rocketGame.multiplier / rocketGame.targetMultiplier) * 95);
            const rocketElement = document.querySelector('.rocket-ship-horizontal');
            if (rocketElement) {
                rocketElement.style.left = `${Math.min(95, progress)}%`;
            }
            
            if (rocketGame.multiplier >= rocketGame.targetMultiplier) {
                clearInterval(rocketGame.interval);
                rocketGame.active = false;
                
                const rocketEl = document.querySelector('.rocket-ship-horizontal');
                if (rocketEl) {
                    rocketEl.classList.remove('flying');
                    rocketEl.classList.add('exploding');
                }
                
                showExplosionEffect();
                addPastCoefficient(rocketGame.multiplier);
                showToast(`💥 РАКЕТА ВЗОРВАЛАСЬ на x${rocketGame.multiplier}!`, true);
                renderRocketGame();
            } else {
                renderRocketGame();
            }
        }, 80);
        
        renderRocketGame();
        showToast(`🚀 Ракета взлетает! Цель ~x${rocketGame.targetMultiplier}`, false);
    }
    
    function cashoutRocket() {
        if (!rocketGame.active) {
            showToast('Нет активного полёта!', true);
            return;
        }
        if (rocketGame.cashedOut) {
            showToast('Вы уже забрали выигрыш!', true);
            return;
        }
        
        const win = Math.floor(rocketGame.currentBet * rocketGame.multiplier);
        addWin(win);
        rocketGame.cashedOut = true;
        
        const participant = rocketGame.participants.find(p => p.name === 'Вы');
        if (participant) participant.cashedOut = true;
        
        showToast(`💰 ВЫ ЗАБРАЛИ ${win} Stars (x${rocketGame.multiplier})!`, false);
        renderRocketGame();
    }
    
    function newRocketRound() {
        if (rocketGame.active || rocketGame.countingDown) {
            showToast('Дождитесь окончания текущего раунда!', true);
            return;
        }
        if (rocketGame.interval) clearInterval(rocketGame.interval);
        if (rocketGame.countdownInterval) clearInterval(rocketGame.countdownInterval);
        
        rocketGame.active = false;
        rocketGame.countingDown = false;
        rocketGame.cashedOut = false;
        rocketGame.myBetPlaced = false;
        rocketGame.currentBet = 0;
        rocketGame.participants = [];
        
        startCountdown();
    }
    
    function renderRocketGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        const totalBet = rocketGame.participants.reduce((sum, p) => sum + p.bet, 0);
        
        let pastHtml = '<div class="past-coefficients">';
        pastCoefficients.slice(0, 10).forEach(c => {
            pastHtml += `<span class="past-coeff">x${c.toFixed(2)}</span>`;
        });
        pastHtml += '</div>';
        
        let participantsHtml = '<div class="participants-list">';
        if (rocketGame.participants.length === 0) {
            participantsHtml += '<div style="text-align:center; padding:12px; opacity:0.5;">Ожидание ставок...</div>';
        } else {
            rocketGame.participants.forEach(p => {
                participantsHtml += `<div class="participant"><span>${p.name}</span><span>⭐ ${p.bet} ${p.cashedOut ? '✅' : ''}</span></div>`;
            });
        }
        participantsHtml += '</div>';
        
        if (rocketGame.countingDown) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">🚀 ROCKET 🚀</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${rocketGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="timer-display">⏱️ ${rocketGame.countdown} сек</div>
                    ${participantsHtml}
                    <div class="info-panel">
                        <div class="info-row"><span>💰 СТАВКА</span><span>${rocketGame.bet} STARS</span></div>
                        <div class="info-row"><span>🚀 МАКС. ВЫИГРЫШ</span><span>до x25</span></div>
                        ${rocketGame.myBetPlaced ? '<div class="potential-win">✅ ВАША СТАВКА ПРИНЯТА! Ждите старта...</div>' : '<div class="potential-win">💰 СДЕЛАЙТЕ СТАВКУ ДО КОНЦА ОТСЧЁТА</div>'}
                    </div>
                    <button class="btn" id="placeBetBtn" ${rocketGame.myBetPlaced ? 'disabled' : ''}>💎 СДЕЛАТЬ СТАВКУ 💎</button>
                    ${pastHtml}
                </div>
            `;
            
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { rocketGame.bet = parseInt(btn.dataset.bet); renderRocketGame(); };
            });
            const placeBtn = document.getElementById('placeBetBtn');
            if (placeBtn) placeBtn.onclick = placeRocketBet;
            return;
        }
        
        if (!rocketGame.active && !rocketGame.countingDown) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">🚀 ROCKET 🚀</div>
                    <div class="section-label">💰 ВЫБОР СТАВКИ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${rocketGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                        <button class="bet-btn ${rocketGame.bet === 1000 ? 'active' : ''}" data-bet="1000">1000 ⭐</button>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>💰 СТАВКА</span><span>${rocketGame.bet} STARS</span></div>
                        <div class="info-row"><span>🚀 МАКС. ВЫИГРЫШ</span><span>до x25</span></div>
                    </div>
                    <button class="btn" id="newRoundBtn">🚀 НОВЫЙ РАУНД (10 сек) 🚀</button>
                    ${pastHtml}
                </div>
            `;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.onclick = () => { rocketGame.bet = parseInt(btn.dataset.bet); renderRocketGame(); };
            });
            document.getElementById('newRoundBtn').onclick = newRocketRound;
            return;
        }
        
        const potentialWin = Math.floor(rocketGame.currentBet * rocketGame.multiplier);
        
        container.innerHTML = `
            <div class="game-card">
                <div class="game-title">🚀 ROCKET IN FLIGHT 🚀</div>
                <div class="rocket-track">
                    <div class="rocket-flight-area">
                        <div class="rocket-ship-horizontal flying" style="left: ${Math.min(95, (rocketGame.multiplier / rocketGame.targetMultiplier) * 95)}%">🚀<div class="rocket-flame"></div></div>
                        <div class="finish-line"></div>
                    </div>
                </div>
                <div class="coefficient-display">x${rocketGame.multiplier}</div>
                ${participantsHtml}
                <div class="info-panel">
                    <div class="info-row"><span>💎 ВАША СТАВКА</span><span>${rocketGame.currentBet} STARS</span></div>
                    <div class="info-row"><span>🎯 ТЕКУЩИЙ МНОЖИТЕЛЬ</span><span>x${rocketGame.multiplier}</span></div>
                    <div class="potential-win">💰 ПОТЕНЦИАЛЬНЫЙ ВЫИГРЫШ: ${potentialWin.toLocaleString()} STARS 💰</div>
                </div>
                <button class="btn btn-cash" id="cashoutRocketBtn" ${rocketGame.cashedOut ? 'disabled' : ''}>🚀 ЗАБРАТЬ ВЫИГРЫШ 🚀</button>
                ${pastHtml}
            </div>
        `;
        
        const cashoutBtn = document.getElementById('cashoutRocketBtn');
        if (cashoutBtn) cashoutBtn.onclick = cashoutRocket;
    }
    
    // ========== ИГРА: МИННОЕ ПОЛЕ (упрощённо) ==========
    let minesGame = {
        active: false, board: [], revealed: [], minesCount: 3, bet: 50,
        multiplier: 1, safeLeft: 0, currentBet: 0, cellsRevealed: 0, maxMultiplier: 0
    };
    
    function getBaseMultiplier(minesCount) {
        return {3: 3.5, 5: 6.5, 7: 11.0}[minesCount] || 3.5;
    }
    
    function initMinesGame() {
        if (!deductStars(minesGame.bet)) return;
        minesGame.active = true;
        minesGame.currentBet = minesGame.bet;
        minesGame.multiplier = 1;
        minesGame.cellsRevealed = 0;
        const size = 5;
        const totalMines = minesGame.minesCount;
        let newBoard = Array(size).fill().map(() => Array(size).fill(0));
        let minesPlaced = 0;
        while (minesPlaced < totalMines) {
            const r = Math.floor(Math.random() * size);
            const c = Math.floor(Math.random() * size);
            if (newBoard[r][c] !== -1) { newBoard[r][c] = -1; minesPlaced++; }
        }
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (newBoard[i][j] !== -1) {
                    let cnt = 0;
                    for (let di = -1; di <= 1; di++) {
                        for (let dj = -1; dj <= 1; dj++) {
                            if (di === 0 && dj === 0) continue;
                            const ni = i+di, nj = j+dj;
                            if (ni>=0 && ni<size && nj>=0 && nj<size && newBoard[ni][nj]===-1) cnt++;
                        }
                    }
                    newBoard[i][j] = cnt;
                }
            }
        }
        minesGame.board = newBoard;
        minesGame.revealed = Array(size).fill().map(() => Array(size).fill(false));
        minesGame.safeLeft = size*size - totalMines;
        minesGame.maxMultiplier = getBaseMultiplier(totalMines);
        renderMinesGame();
        showToast(`🚀 Игра началась! Ставка ${minesGame.bet} Stars`, false);
    }
    
    function revealMineCell(row, col) {
        if (!minesGame.active || minesGame.revealed[row][col]) return;
        if (minesGame.board[row][col] === -1) {
            minesGame.active = false;
            showExplosionEffect();
            showToast(`💥 ВЗРЫВ! Проиграно ${minesGame.currentBet} Stars`, true);
            renderMinesGame();
            return;
        }
        minesGame.revealed[row][col] = true;
        minesGame.safeLeft--;
        minesGame.cellsRevealed++;
        const totalSafe = 25 - minesGame.minesCount;
        const progress = minesGame.cellsRevealed / totalSafe;
        minesGame.multiplier = +(1 + (minesGame.maxMultiplier - 1) * Math.pow(progress, 1.2)).toFixed(2);
        if (minesGame.safeLeft === 0) {
            const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
            addWin(win);
            minesGame.active = false;
            showToast(`🏆 ПОБЕДА! ${win} Stars!`, false);
            renderMinesGame();
            return;
        }
        renderMinesGame();
    }
    
    function cashoutMines() {
        if (!minesGame.active) return;
        const win = Math.floor(minesGame.currentBet * minesGame.multiplier);
        addWin(win);
        minesGame.active = false;
        showToast(`💰 ЗАБРАНО ${win} Stars!`, false);
        renderMinesGame();
    }
    
    function renderMinesGame() {
        const container = document.getElementById('gameContent');
        if (!container) return;
        
        if (!minesGame.active || !minesGame.board.length) {
            container.innerHTML = `
                <div class="game-card">
                    <div class="game-title">💎 MINES 💎</div>
                    <div class="section-label">💰 СТАВКА</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${minesGame.bet === 20 ? 'active' : ''}" data-bet="20">20 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 50 ? 'active' : ''}" data-bet="50">50 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 100 ? 'active' : ''}" data-bet="100">100 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 250 ? 'active' : ''}" data-bet="250">250 ⭐</button>
                        <button class="bet-btn ${minesGame.bet === 500 ? 'active' : ''}" data-bet="500">500 ⭐</button>
                    </div>
                    <div class="section-label">💣 МИНЫ</div>
                    <div class="bet-buttons">
                        <button class="bet-btn ${minesGame.minesCount === 3 ? 'active' : ''}" data-mines="3">3 мины (x3.5)</button>
                        <button class="bet-btn ${minesGame.minesCount === 5 ? 'active' : ''}" data-mines="5">5 мин (x6.5)</button>
                        <button class="bet-btn ${minesGame.minesCount === 7 ? 'active' : ''}" data-mines="7">7 мин (x11.0)</button>
                    </div>
                    <div class="info-panel">
                        <div class="info-row"><span>⭐ СТАВКА</span><span>${minesGame.bet} STARS</span></div>
                        <div class="info-row"><span>🏆 МАКС. МНОЖИТЕЛЬ</span><span>x${getBaseMultiplier(minesGame.minesCount)}</span></div>
                    </div>
                    <button class="btn" id="startMinesBtn">💎 НАЧАТЬ ИГРУ 💎</button>
                </div>
            `;
            document.querySelectorAll('.bet-btn[data-bet]').forEach(btn => {
                btn.onclick = () => { minesGame.bet = parseInt(btn.dataset.bet); renderMinesGame(); };
            });
            document.querySelectorAll('.bet-btn[data-mines]').forEach(btn => {
                btn.onclick = () => { minesGame.minesCount = parseInt(btn.dataset.mines); renderMinesGame(); };
            });
            document.getElementById('startMinesBtn').onclick = initMinesGame;
            return;
        }
        
        let gridHtml = '<div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0;">';
        for (let i = 0; i < 5; i++) {
            for (let j = 0; j < 5; j++) {
                const isRevealed = minesGame.revealed[i][j];
                let content = '💎', style = '';
                if (isRevealed) {
                    if (minesGame.board[i][j] === -1) { content = '💣'; style = 'background: linear-gradient(145deg, #9b2c2c, #5a1010);'; }
                    else { content = '💎'; style = 'background: linear-gradient(145deg, #2a7a4a, #1a5a3a);'; }
                }
                gridHtml += `<div style="background: linear-gradient(145deg, rgba(30,28,22,0.9), rgba(20,18,14,0.95)); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; aspect-ratio: 1; cursor: pointer; border: 1px solid rgba(255,215,0,0.2); ${style}" onclick="window.revealMineCell(${i},${j})">${content}</div>`;
            }
        }
        gridHtml += '</div>';
        
        const totalSafe = 25 - minesGame.minesCount;
        const progress = Math.floor((minesGame.cellsRevealed / totalSafe) * 100);
        const potentialWin = Math.floor(minesGame.currentBet * minesGame.multiplier);
        
        container.innerHTML = `
            <div class="game-card">
                <div class="game-title">💎 MINES | ${minesGame.minesCount} MINES 💎</div>
                ${gridHtml}
                <div class="info-panel">
                    <div class="info-row"><span>🎯 ПРОГРЕСС</span><span>${progress}%</span></div>
                    <div class="info-row"><span>💎 БЕЗОПАСНО</span><span>${minesGame.safeLeft} / ${totalSafe}</span></div>
                    <div class="multiplier-preview" style="font-size:42px; font-weight:800; background:linear-gradient(135deg,#ffd700,#ffaa00); -webkit-background-clip:text; background-clip:text; color:transparent; text-align:center;">x${minesGame.multiplier}</div>
                    <div class="potential-win">💰 ЗАБРАТЬ: ${potentialWin.toLocaleString()} STARS 💰</div>
                </div>
                <button class="btn btn-cash" onclick="window.cashoutMines()">💰 ЗАБРАТЬ ВЫИГРЫШ 💰</button>
            </div>
        `;
    }
    
    // ========== КОЛЕСО ФОРТУНЫ ==========
    function renderWheelGame() {
        const container = document.getElementById('gameContent');
        container.innerHTML = `<div class="game-card"><div class="game-title">🎡 FORTUNE WHEEL</div><div style="text-align:center; padding:60px 20px;"><div style="font-size: 64px;">🎡</div><p style="opacity: 0.7;">Скоро будет доступно...</p></div></div>`;
    }
    
    // ========== ГЛАВНОЕ МЕНЮ ==========
    function renderMainMenu() {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `
            <div class="games-grid">
                <div class="game-menu-card" data-game="mines">
                    <div class="game-menu-icon">💎</div>
                    <div class="game-menu-title">MINES</div>
                    <div class="game-menu-desc">Классическое минное поле. Множитель до x11!</div>
                    <div class="game-menu-badge">🔥 ПОПУЛЯРНОЕ</div>
                </div>
                <div class="game-menu-card" data-game="wheel">
                    <div class="game-menu-icon">🎡</div>
                    <div class="game-menu-title">FORTUNE WHEEL</div>
                    <div class="game-menu-desc">Колесо фортуны — испытай удачу!</div>
                    <div class="game-menu-badge">⚡ СКОРО</div>
                </div>
                <div class="game-menu-card" data-game="rocket">
                    <div class="game-menu-icon">🚀</div>
                    <div class="game-menu-title">ROCKET</div>
                    <div class="game-menu-desc">Ракетка. Лети выше, лови момент и забирай выигрыш до x25!</div>
                    <div class="game-menu-badge">🚀 АКТИВНА</div>
                </div>
            </div>
        `;
        
        document.querySelectorAll('.game-menu-card').forEach(card => {
            card.onclick = () => openGame(card.dataset.game);
        });
    }
    
    function openGame(gameId) {
        const mainContent = document.getElementById('mainContent');
        mainContent.innerHTML = `<button class="back-btn" id="backToMenuBtn">← ВЕРНУТЬСЯ В МЕНЮ</button><div id="gameContent"></div>`;
        document.getElementById('backToMenuBtn').onclick = () => {
            if (rocketGame.interval) clearInterval(rocketGame.interval);
            if (rocketGame.countdownInterval) clearInterval(rocketGame.countdownInterval);
            rocketGame.active = false;
            rocketGame.countingDown = false;
            renderMainMenu();
        };
        
        if (gameId === 'mines') renderMinesGame();
        else if (gameId === 'wheel') renderWheelGame();
        else if (gameId === 'rocket') renderRocketGame();
    }
    
    window.revealMineCell = revealMineCell;
    window.cashoutMines = cashoutMines;
    
    if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
    
    updateBalanceUI();
    renderMainMenu();
</script>
</body>
</html>
